<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ChiroStats Test</title>
</head>
<body style="margin:0;background:#0f1117;color:white;font-family:sans-serif;">
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.development.js"&gt;&lt;/script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"&gt;&lt;/script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"&gt;&lt;/script>
<script type="text/babel">
function App() {
const [count, setCount] = React.useState(0);
return (
<div style={{padding:40}}>
<h1 style={{color:"#4f8ef7"}}>ChiroStats is working! ✓</h1>
<p>Click to test: <button onClick={() => setCount(c => c+1)}>{count}</button></p>
</div>
);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
