function pct(num, denom) {
  if (!denom || denom === 0) return null;
  return (num / denom) * 100;
}
function fmt(n, decimals = 0) {
  if (n === null || n === undefined || isNaN(n)) return "—";
  return Number(n).toLocaleString("en-US", { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}
function fmtDollar(n) {
  if (n === null || n === undefined || isNaN(n)) return "—";

// Generate business days for YEAR
function gen2026Days() {
  const weeks = [];
  const start = new Date(YEAR, 0, 1);
  let cur = new Date(start);
  while (cur.getFullYear() === YEAR) {
    const weekDays = [];
    const weekStart = new Date(cur);
    // Mon-Fri week
    while (weekDays.length < 5 && cur.getFullYear() === YEAR) {
      const dow = cur.getDay();
      if (dow !== 0 && dow !== 6) {
        weekDays.push({
          date: new Date(cur),
          label: `${cur.getMonth()+1}/${cur.getDate()}`,
          month: cur.getMonth(),
        });
      }
      cur.setDate(cur.getDate() + 1);
      if (cur.getDay() === 1 && weekDays.length > 0) break;
    }
    if (weekDays.length > 0) {
      const wl = weekStart;
      const we = weekDays[weekDays.length - 1].date;
      weeks.push({
        label: `${wl.getMonth()+1}/${wl.getDate()}-${we.getMonth()+1}/${we.getDate()}`,
        days: weekDays.map(d => ({
          ...d,
          scheduled: 0, pv: 0, np: 0, mnp: 0, ma: 0, rs: 0, wi: 0,
          services: 0, checks: 0, cash: 0, cc: 0, ins: 0, pi: 0, supplements: 0,
        }))
      });
    }
  }
  return weeks;
}

          if (d[`googleLSAAds_${i}`]) mkt.googleLSA[i] = { ...(mkt.googleLSA[i]||{}), ...d[`googleLSAAds_${i}`] };

  const setNpMonth     = useCallback((u) => { setNpMonthRaw(p     => { const n=typeof u==="function"?u(p):u; clearTimeout(saveTimers.current.npMonth);     saveTimers.current.npMonth    =setTimeout(()=>saveField("npMonth",n),800);     flash(); return n; }); }, [flash]);

    if (!window.confirm("Reset ALL data? This cannot be undone.")) return;
    db.collection(DB_COLLECTION).doc(DOC_ID).set({}).then(() => window.location.reload());
  }, []);
  const monthlyTotals = useMemo(() => {
    const totals = MONTHS.map(() => ({ pv:0,adjustments:0,decompression:0,softwave:0,np:0,mnp:0,ma:0,rs:0,wi:0,services:0,checks:0,cash:0,cc:0,ins:0,pi:0,collections:0,refund:0,supplements:0,scheduled:0 }));

        totals[m].adjustments += Number(d.adjustments)||0;

        totals[m].softwave += Number(d.softwave)||0;
        totals[m].np += Number(d.np)||0;
        totals[m].mnp += Number(d.mnp)||0;
        totals[m].ma += Number(d.ma)||0;
        totals[m].rs += Number(d.rs)||0;
        totals[m].wi += Number(d.wi)||0;
        totals[m].services += Number(d.services)||0;
        totals[m].checks += Number(d.checks)||0;
        totals[m].cash += Number(d.cash)||0;
        totals[m].cc += Number(d.cc)||0;
        totals[m].ins += Number(d.ins)||0;
        totals[m].pi += Number(d.pi)||0;
        totals[m].supplements += Number(d.supplements)||0;
        totals[m].refund += (Number(d.refund)||0);

    }));
    return totals;
  }, [dailyWeeks]);

  const yearTotals = useMemo(() => {
    return monthlyTotals.reduce((acc, m) => {
      Object.keys(acc).forEach(k => { acc[k] += m[k]; });
      return acc;
    }, { pv:0,adjustments:0,decompression:0,softwave:0,np:0,mnp:0,ma:0,rs:0,wi:0,services:0,checks:0,cash:0,cc:0,ins:0,pi:0,collections:0,refund:0,supplements:0,scheduled:0 });

  // ── Derived: NP monthly stats
  const npStats = useMemo(() => {
    return (npData || Array(12).fill(null).map(() => ({ patients: [] }))).map(mo => {
      const pts = (mo && mo.patients) ? mo.patients : [];
      const totalNP = pts.length;
      const d1 = pts.filter(p => p.day1Date).length;
      const d2 = pts.filter(p => p.day2Date).length;
      const activeClose = pts.filter(p => p.closed === "Y").length;
      const wellnessClose = pts.filter(p => p.wellnessClose === "Y").length;
      const lifetimeClose = pts.filter(p => p.lifetimeClose === "Y").length;
      const drH = pts.filter(p => p.doctor === "Dr.H");
      const drA = pts.filter(p => p.doctor === "Dr.A");
      const sourceCounts = {};
      SOURCES.forEach(s => { sourceCounts[s] = { total: 0, close: 0 }; });
      pts.forEach(p => {
        const src = p.source || '';
        if (!sourceCounts[src]) sourceCounts[src] = { total: 0, close: 0 };
        sourceCounts[src].total++;
        if (p.closed === "Y") sourceCounts[src].close++;
      });
      const insCounts = {};
      INSURANCE_TYPES.forEach(t => { insCounts[t] = { total: 0, close: 0 }; });
      pts.forEach(p => {
        if (p.insuranceCash && insCounts[p.insuranceCash]) {
          insCounts[p.insuranceCash].total++;
          if (p.closed === "Y") insCounts[p.insuranceCash].close++;
        }
      });
      const npTypes = { Chiropractic: 0, Decompression: 0, Softwave: 0 };
      pts.forEach(p => { if (p.npType && npTypes[p.npType] !== undefined) npTypes[p.npType]++; });
      return { totalNP, d1, d2, activeClose, wellnessClose, lifetimeClose, drH: drH.length, drA: drA.length, sourceCounts, insCounts, npTypes, inactives: mo && mo.monthlyInactives ? mo.monthlyInactives : 0, referOut: mo && mo.referOut ? mo.referOut : 0 };

// ─── DASHBOARD ────────────────────────────────────────────────────────────────
function Dashboard({ yearTotals, monthlyTotals, npStats, monthlyNP, bonuses, bizReview, marketing }) {
  const totalNP = npStats.reduce((s, m) => s + m.totalNP, 0);
  const totalCloses = npStats.reduce((s, m) => s + m.activeClose, 0);
  const closeRate = pct(totalCloses, totalNP);
  const ova = yearTotals.pv > 0 ? yearTotals.collections / yearTotals.pv : 0;
  const pva = yearTotals.np > 0 ? yearTotals.pv / yearTotals.np : 0;
  const currentMonth = new Date().getMonth();
  const curMo = monthlyTotals[currentMonth] || monthlyTotals[0];
  const curNP = npStats[currentMonth] || npStats[0];
  const totalInactives = npStats.reduce((s, m) => s + m.inactives, 0);
  const netMomentum = totalCloses - totalInactives;

  const kpis = [
    { label: "YTD Collections", value: fmtDollar(yearTotals.collections), sub: `${MONTHS[currentMonth]} ${fmtDollar(curMo.collections)}`, color: "#4f8ef7" },
    { label: "YTD Patient Visits", value: fmt(yearTotals.pv), sub: `OVA ${fmtDollar(ova)}`, color: "#a78bfa" },
    { label: "New Patients YTD", value: fmt(totalNP), sub: `This month: ${curNP.totalNP}`, color: "#34d399" },
    { label: "Close Rate", value: closeRate !== null ? fmtPct(closeRate) : "—", sub: `${totalCloses} of ${totalNP} closed`, color: "#fbbf24" },
    { label: "Net Momentum", value: fmt(netMomentum), sub: `Closes ${totalCloses} − Inactives ${totalInactives}`, color: netMomentum >= 0 ? "#34d399" : "#f87171" },
    { label: "Avg Visit Value", value: fmtDollar(ova), sub: `PVA ${fmt(pva, 1)}`, color: "#60a5fa" },
    { label: "YTD Services", value: fmtDollar(yearTotals.services), sub: `Supplements ${fmtDollar(yearTotals.supplements)}`, color: "#fb923c" },
    { label: "Total PV", value: fmt(yearTotals.pv), sub: `NP ${fmt(yearTotals.np)} | RS ${fmt(yearTotals.rs)} | WI ${fmt(yearTotals.wi)}`, color: "#e879f9" },
  ];

  return (
    <div>
      <div style={{ marginBottom: 28 }}>
        <h1 style={{ fontSize: 26, fontWeight: 700, letterSpacing: "-0.02em" }}>{YEAR} Practice Dashboard</h1>
        <p style={{ color: "#8891aa", marginTop: 4, fontSize: 14 }}>Live metrics across all practice areas</p>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(220px, 1fr))", gap: 14, marginBottom: 32 }}>
        {kpis.map(k => (
          <div key={k.label} className="kpi-card">
            <div style={{ fontSize: 11, color: "#8891aa", fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 6 }}>{k.label}</div>
            <div style={{ fontSize: 26, fontWeight: 700, color: k.color, letterSpacing: "-0.02em", lineHeight: 1 }}>{k.value}</div>
            <div style={{ fontSize: 12, color: "#8891aa", marginTop: 6 }}>{k.sub}</div>
          </div>
        ))}
      </div>

      {/* Monthly collections bar */}
      <div className="kpi-card" style={{ marginBottom: 20 }}>
        <div className="section-header">Monthly Collections Trend</div>
        <div style={{ display: "flex", alignItems: "flex-end", gap: 6, height: 90 }}>
          {monthlyTotals.map((m, i) => {
            const maxColl = Math.max(...monthlyTotals.map(x => x.collections), 1);
            const h = Math.max(4, (m.collections / maxColl) * 80);
            return (
              <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
                <div style={{ width: "100%", background: m.collections > 0 ? "#4f8ef7" : "#2e3247", height: h, borderRadius: "4px 4px 0 0", transition: "height 0.3s", minHeight: 4 }} title={`${MONTHS[i]}: ${fmtDollar(m.collections)}`} />
                <div style={{ fontSize: 10, color: "#8891aa" }}>{MONTHS[i]}</div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Monthly NP bar */}
      <div className="kpi-card" style={{ marginBottom: 20 }}>
        <div className="section-header">Monthly New Patients</div>
        <div style={{ display: "flex", alignItems: "flex-end", gap: 6, height: 80 }}>
          {npStats.map((m, i) => {
            const maxNP = Math.max(...npStats.map(x => x.totalNP), 1);
            const h = Math.max(4, (m.totalNP / maxNP) * 70);
            return (
              <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
                <div style={{ width: "100%", background: m.totalNP > 0 ? "#a78bfa" : "#2e3247", height: h, borderRadius: "4px 4px 0 0", minHeight: 4 }} title={`${MONTHS[i]}: ${m.totalNP} NP`} />
                <div style={{ fontSize: 10, color: "#8891aa" }}>{MONTHS[i]}</div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Payment mix */}
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
        <div className="kpi-card">
          <div className="section-header">Collections Mix</div>
          {[
            { label: "Credit Card", val: yearTotals.cc, color: "#4f8ef7" },
            { label: "Insurance", val: yearTotals.ins, color: "#a78bfa" },
            { label: "Cash", val: yearTotals.cash, color: "#34d399" },
            { label: "Checks", val: yearTotals.checks, color: "#fbbf24" },
            { label: "PI/WC", val: yearTotals.pi, color: "#fb923c" },
          ].map(r => {
            const pctVal = yearTotals.collections > 0 ? (r.val / yearTotals.collections) * 100 : 0;
            return (
              <div key={r.label} style={{ marginBottom: 10 }}>
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 3 }}>
                  <span style={{ color: "#c8cfe0" }}>{r.label}</span>
                  <span style={{ fontFamily: "'DM Mono', monospace", color: r.color }}>{fmtDollar(r.val)} ({fmtPct(pctVal)})</span>
                </div>
                <div style={{ height: 5, background: "#2e3247", borderRadius: 3 }}>
                  <div style={{ height: "100%", width: `${pctVal}%`, background: r.color, borderRadius: 3, transition: "width 0.5s" }} />
                </div>
              </div>
            );
          })}
        </div>
        <div className="kpi-card">
          <div className="section-header">NP Source Breakdown (YTD)</div>
          {SOURCES.map(s => {
            const total = npStats.reduce((sum, m) => sum + (m.sourceCounts[s]?.total || 0), 0);
            const closes = npStats.reduce((sum, m) => sum + (m.sourceCounts[s]?.close || 0), 0);
            if (total === 0) return null;
            return (
              <div key={s} style={{ display: "flex", justifyContent: "space-between", fontSize: 12, padding: "4px 0", borderBottom: "1px solid #1e2130" }}>
                <span style={{ color: "#c8cfe0" }}>{s}</span>
                <span style={{ fontFamily: "'DM Mono', monospace" }}>{total} leads / {closes} closed ({closes > 0 ? fmtPct(pct(closes, total)) : "—"})</span>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ─── DAILY LOG ────────────────────────────────────────────────────────────────
function DailyLog({ dailyWeeks, setDailyWeeks, monthlyTotals, yearTotals }) {
  const [openWeeks, setOpenWeeks] = useState(() => new Set([0]));
  const [filterMonth, setFilterMonth] = useState("all");
  const [selectedMonth, setSelectedMonth] = useState(null);

  const updateDay = useCallback((wi, di, field, val) => {
    setDailyWeeks(prev => {
      const next = prev.map((w, i) => i !== wi ? w : {
        ...w, days: w.days.map((d, j) => j !== di ? d : { ...d, [field]: val })
      });
      return next;
    });
  }, [setDailyWeeks]);

  const weekTotal = (days, field) => days.reduce((s, d) => s + (Number(d[field]) || 0), 0);
  const collections = d => (Number(d.checks)||0)+(Number(d.cash)||0)+(Number(d.cc)||0)+(Number(d.ins)||0)+(Number(d.pi)||0)-(Number(d.refund)||0);

  const apptCols = ["scheduled","pv","adjustments","decompression","softwave","np","ma","rs","wi","services"];
  const apptLabels = ["Sched","PV","Adj","Decomp","SW","NP","MA","RS","WI","Services"];
  const collCols = ["checks","cash","cc","ins","refund","collections","supplements"];
  const collLabels = ["Checks","Cash","CC","Ins","Refund","Collections","Suppl"];
  const cols = [...apptCols, ...collCols];
  const colLabels = [...apptLabels, ...collLabels];

  const filteredWeeks = filterMonth === "all" ? dailyWeeks : dailyWeeks.filter(w => w.days.some(d => d.month === Number(filterMonth)));

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
        <div>
          <h2 style={{ fontSize: 20, fontWeight: 700 }}>Daily Log</h2>
          <p style={{ color: "#8891aa", fontSize: 13 }}>Click any cell to edit. Weekly totals auto-calculate.</p>
        </div>
        <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
          <select value={filterMonth} onChange={e => setFilterMonth(e.target.value)} style={{ width: 130 }}>
            <option value="all">All Months</option>
            {MONTHS.map((m, i) => <option key={m} value={i}>{MONTH_NAMES[i]}</option>)}
          </select>
        </div>
      </div>

      {/* Monthly completion cards */}
      {(() => {
        const today = new Date();
        const allDaysByMonth = MONTHS.map((mo, mi) => dailyWeeks.flatMap(w => w.days).filter(d => d.month === mi));
        return (
          <div style={{ marginBottom: 24 }}>
            <div style={{ display: "flex", gap: 8, overflowX: "auto" }}>
              {MONTHS.map((mo, mi) => {
                const allDays = allDaysByMonth[mi];
                const totalDays = allDays.length;
                const enteredDays = allDays.filter(d => {
                  const parts = d.label.split('/');
                  const dayDate = new Date(YEAR, parseInt(parts[0])-1, parseInt(parts[1]));
                  return dayDate <= today && d.hasAppt && d.hasCollections;
                }).length;
                const monthStarted = today >= new Date(YEAR, mi, 1);
                const isComplete = enteredDays === totalDays && totalDays > 0;
                const isSelected = selectedMonth === mi;
                const textColor = isComplete ? "#4ade80" : "#8891aa";
                return (
                  <div key={mo} onClick={() => setSelectedMonth(isSelected ? null : mi)}
                    className="kpi-card"
                    style={{ padding: "10px 12px", border: `1px solid ${isSelected ? "#4f8ef7" : isComplete ? "#166534" : "#2e3247"}`, background: isSelected ? "#1a2540" : isComplete ? "#14532d18" : "#161922", opacity: monthStarted ? 1 : 0.4, minWidth: 80, flex: "1 1 0", textAlign: "center", cursor: "pointer", transition: "all 0.15s" }}>
                    <div style={{ fontSize: 10, color: isSelected ? "#4f8ef7" : textColor, textTransform: "uppercase", letterSpacing: ".08em", fontWeight: 700, marginBottom: 6 }}>{mo}</div>
                    <div style={{ fontSize: 20, fontWeight: 700, color: isSelected ? "#4f8ef7" : textColor }}>{enteredDays}<span style={{ fontSize: 12, color: "#4a5568", fontWeight: 400 }}>/{totalDays}</span></div>
                    <div style={{ fontSize: 10, color: isComplete ? "#4ade80" : "#555a6e", marginTop: 4 }}>{isComplete ? "✓ Complete" : monthStarted ? "In progress" : "Not started"}</div>
                  </div>
                );
              })}
            </div>

            {/* Day dots row */}
            {selectedMonth !== null && (() => {
              const allDays = allDaysByMonth[selectedMonth];
              return (
                <div style={{ background: "#0f1117", border: "1px solid #2e3247", borderTop: "none", borderRadius: "0 0 10px 10px", padding: "12px 16px" }}>
                  <div style={{ fontSize: 11, color: "#8891aa", marginBottom: 8 }}>
                    {MONTH_NAMES[selectedMonth]} — click a day below to jump to it
                  </div>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                    {allDays.map((d, idx) => {
                      // Parse day date to check if it's in the past
                      const parts = d.label.split('/');
                      const dayDate = new Date(YEAR, parseInt(parts[0])-1, parseInt(parts[1]));
                      const isPast = dayDate <= today;
                      const hasAppt = isPast && !!d.hasAppt;
                      const hasColl = isPast && !!d.hasCollections;
                      return (
                        <div key={idx} title={d.label} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 3, opacity: isPast ? 1 : 0.3 }}>
                          <div style={{ fontSize: 10, color: "#8891aa", fontWeight: 600 }}>{d.label.split('/')[1]}</div>
                          <div title="Appointments" style={{ width: 28, height: 14, borderRadius: 3, background: hasAppt ? "#14532d" : "#1e2130", border: `1px solid ${hasAppt ? "#22c55e" : "#2e3247"}`, display: "flex", alignItems: "center", justifyContent: "center" }}>
                            <span style={{ fontSize: 8, color: hasAppt ? "#4ade80" : "#555a6e" }}>APT</span>
                          </div>
                          <div title="Collections" style={{ width: 28, height: 14, borderRadius: 3, background: hasColl ? "#14532d" : "#1e2130", border: `1px solid ${hasColl ? "#22c55e" : "#2e3247"}`, display: "flex", alignItems: "center", justifyContent: "center" }}>
                            <span style={{ fontSize: 8, color: hasColl ? "#4ade80" : "#555a6e" }}>COL</span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })()}
          </div>
        );
      })()}

      {filteredWeeks.map((week, wi) => {
        const realWi = dailyWeeks.indexOf(week);
        const isOpen = openWeeks.has(realWi);
        const wTotals = {};
        cols.forEach(c => { wTotals[c] = c === "collections" ? week.days.reduce((s, d) => s + collections(d), 0) : weekTotal(week.days, c); });
        return (
          <div key={realWi} style={{ marginBottom: 8, background: "#161922", border: "1px solid #2e3247", borderRadius: 10, overflow: "hidden" }}>
            <div onClick={() => setOpenWeeks(prev => { const n = new Set(prev); n.has(realWi) ? n.delete(realWi) : n.add(realWi); return n; })}
              style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 16px", cursor: "pointer", background: isOpen ? "#1a1d27" : "transparent" }}>
              <div style={{ display: "flex", gap: 16, alignItems: "center" }}>
                <span style={{ fontSize: 13, fontWeight: 600, color: "#a5b4fc" }}>Week of {week.label}</span>
                <span style={{ fontSize: 12, color: "#8891aa" }}>{MONTH_NAMES[week.days[0]?.month]}</span>
              </div>
              <div style={{ display: "flex", gap: 16, alignItems: "center" }}>
                <span style={{ fontSize: 12, color: "#4f8ef7", fontFamily: "'DM Mono', monospace" }}>{fmtDollar(wTotals.collections)}</span>
                <span style={{ fontSize: 12, color: "#a78bfa", fontFamily: "'DM Mono', monospace" }}>PV {wTotals.pv}</span>
                <span style={{ color: "#8891aa", fontSize: 14 }}>{isOpen ? "▲" : "▼"}</span>
              </div>
            </div>
            {isOpen && (
              <div className="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Date</th>
                      {colLabels.map(l => <th key={l}>{l}</th>)}
                    </tr>
                  </thead>
                  <tbody>
                    {week.days.map((day, di) => (
                      <tr key={di}>
                        <td style={{ color: "#c8cfe0", fontWeight: 500, textAlign: "center" }}>{day.label}</td>
                        {cols.map(c => (
                          c === "collections"
                            ? <td key={c} style={{ color: "#4f8ef7", textAlign: "center" }}>{fmtDollar(collections(day))}</td>
                            : c === "refund"
                            ? <td key={c} style={{ color: "#f87171", textAlign: "center" }}>{fmtDollar(Number(day.refund)||0)}</td>
                            : c === "pv"
                            ? <td key={c} style={{ color: "#a78bfa", textAlign: "center" }}>{fmt((Number(day.adjustments)||0)+(Number(day.decompression)||0)+(Number(day.softwave)||0))}</td>
                            : <td key={c} style={{ padding: 0, textAlign: "center" }}>
                                <input className="cell-input" type="number" value={day[c] || ""} placeholder="0"
                                  onChange={e => updateDay(realWi, di, c, e.target.value)} />
                              </td>
                        ))}
                      </tr>
                    ))}
                    <tr className="week-total">
                      <td style={{ textAlign: "center" }}>Weekly Total</td>
                      {cols.map(c => (
                        <td key={c} style={{ color: c === "collections" ? "#4f8ef7" : c === "pv" ? "#a78bfa" : undefined, textAlign: "center" }}>
                          {c === "pv" ? fmt((wTotals.adjustments||0)+(wTotals.decompression||0)+(wTotals.softwave||0)) : c === "collections" || c === "services" || c === "checks" || c === "cash" || c === "cc" || c === "ins" || c === "refund" || c === "pi" || c === "supplements" ? fmtDollar(wTotals[c]) : fmt(wTotals[c])}
                        </td>
                      ))}
                    </tr>
                  </tbody>
                </table>
              </div>
            )}
          </div>
        );
      })}

      {/* Monthly summary */}
      <div style={{ marginTop: 28 }}>
        <div className="section-header">Monthly Summary</div>
        <div className="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Month</th>
                <th>Scheduled</th><th>PV</th><th>NP</th><th>MA</th><th>RS</th><th>WI</th>
                <th>Services</th><th>Checks</th><th>Cash</th><th>CC</th><th>Insurance</th><th>PI</th><th>Collections</th><th>Suppl</th>
              </tr>
            </thead>
            <tbody>
              {[0,1,2].map(q => (
                <React.Fragment key={q}>
                  {[0,1,2].map(mi => {
                    const i = q * 3 + mi;
                    const m = monthlyTotals[i];
                    return (
                      <tr key={i}>
                        <td style={{ textAlign: "center", color: "#c8cfe0" }}>{MONTH_NAMES[i]}</td>
                        <td>{fmt(m.scheduled)}</td><td>{fmt(m.pv)}</td><td>{fmt(m.np)}</td><td>{fmt(m.ma)}</td><td>{fmt(m.rs)}</td><td>{fmt(m.wi)}</td>
                        <td>{fmtDollar(m.services)}</td><td>{fmtDollar(m.checks)}</td><td>{fmtDollar(m.cash)}</td><td>{fmtDollar(m.cc)}</td><td>{fmtDollar(m.ins)}</td><td>{fmtDollar(m.pi)}</td>
                        <td style={{ textAlign: "center", color: "#4f8ef7" }}>{fmtDollar(m.collections)}</td><td>{fmtDollar(m.supplements)}</td>
                      </tr>
                    );
                  })}
                  <tr className="quarter-row">
                    <td>Q{q+1} Total</td>
                    {["scheduled","pv","np","ma","rs","wi","services","checks","cash","cc","ins","pi","refund","collections","supplements"].map(k => {
                      const sum = [0,1,2].reduce((s, mi) => s + monthlyTotals[q*3+mi][k], 0);
                      return <td key={k}>{k==="pv"||k==="np"||k==="ma"||k==="rs"||k==="wi"||k==="scheduled" ? fmt(sum) : fmtDollar(sum)}</td>;
                    })}
                  </tr>
                </React.Fragment>
              ))}
              {[9,10,11].map(i => {
                const m = monthlyTotals[i];
                return (
                  <tr key={i}>
                    <td style={{ textAlign: "center", color: "#c8cfe0" }}>{MONTH_NAMES[i]}</td>
                    <td>{fmt(m.scheduled)}</td><td>{fmt(m.pv)}</td><td>{fmt(m.np)}</td><td>{fmt(m.ma)}</td><td>{fmt(m.rs)}</td><td>{fmt(m.wi)}</td>
                    <td>{fmtDollar(m.services)}</td><td>{fmtDollar(m.checks)}</td><td>{fmtDollar(m.cash)}</td><td>{fmtDollar(m.cc)}</td><td>{fmtDollar(m.ins)}</td><td>{fmtDollar(m.pi)}</td>
                    <td style={{ textAlign: "center", color: "#4f8ef7" }}>{fmtDollar(m.collections)}</td><td>{fmtDollar(m.supplements)}</td>
                  </tr>
                );
              })}
              <tr className="quarter-row">
                <td>Q4 Total</td>
                {["scheduled","pv","np","ma","rs","wi","services","checks","cash","cc","ins","pi","refund","collections","supplements"].map(k => {
                  const sum = [9,10,11].reduce((s, mi) => s + monthlyTotals[mi][k], 0);
                  return <td key={k}>{k==="pv"||k==="np"||k==="ma"||k==="rs"||k==="wi"||k==="scheduled" ? fmt(sum) : fmtDollar(sum)}</td>;
                })}
              </tr>
              <tr className="year-row">
                <td>YEAR TOTAL</td>
                {["scheduled","pv","np","ma","rs","wi","services","checks","cash","cc","ins","pi","refund","collections","supplements"].map(k => {
                  const sum = monthlyTotals.reduce((s, m) => s + m[k], 0);
                  return <td key={k} style={{ color: "#4f8ef7" }}>{k==="pv"||k==="np"||k==="ma"||k==="rs"||k==="wi"||k==="scheduled" ? fmt(sum) : fmtDollar(sum)}</td>;
                })}
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ─── NEW PATIENTS ─────────────────────────────────────────────────────────────
const DOCTORS = ["Dr.H", "Dr.A", "Referral"];
const NP_SOURCES = ["Internet","Patient Referral","Doctor Referral","Facebook Ad","Google Ad","Google LSA Call","Website Scheduling Page","Insurance Company","No Referral Listed","Unknown"];

function NewPatients({ npData, setNpData, scheduledNP, setScheduledNP }) {
  const [viewMonth, setViewMonth] = useState(new Date().getMonth());
  const [closedFilter, setClosedFilter] = useState('all');
  const [editingId, setEditingId] = useState(null);
  const [openNoteId, setOpenNoteId] = useState(null);

  const months = npData || Array(12).fill(null).map(() => ({ patients: [] }));
  const mo = months[viewMonth] || { patients: [] };
  const filteredPatients = closedFilter === 'all' ? mo.patients : mo.patients.filter(p => (p.closed || '') === closedFilter);
  const SOURCE_RENAME = {
    'Google LSA': 'Google LSA Call',
    'Website': 'Website Scheduling Page',
    'Website Scheduling Page': 'Website Scheduling Page',
    'Website Scheduling Page \u2026': 'Website Scheduling Page',
    'Website Scheduling Page\u2026': 'Website Scheduling Page',
    'Insurance Referral': 'Insurance Company',
    'Insurance Company': 'Insurance Company',
    'Unknown': 'Unknown',
  };
  const normalizeSource = (s) => {
    if (!s) return '';
    const cleaned = s.replace(/\s*[…\.]{1,3}\s*$/, '').trim();
    return SOURCE_RENAME[cleaned] || SOURCE_RENAME[s] || cleaned || s;
  };
  const allPatients = months.flatMap(m => (m?.patients || []).map(p => ({
    ...p,
    source: normalizeSource(p.source)
  }))).filter(p => p.doctor !== 'Referral');

  // Monthly stats
  const stats = months.map((m, mi) => {
    const pts = m?.patients || [];
    const total = pts.length;
    const closed = pts.filter(p => p.closed === 'Y').length;
    const completed = pts.filter(p => p.completed).length;
    const d2 = pts.filter(p => p.rof).length;
    const noRof = pts.filter(p => p.closed === 'No ROF').length;
    const mia = pts.filter(p => p.closed === 'MIA').length;
    const referral = pts.filter(p => p.doctor === 'Referral').length;
    const referralOut = referral;
    const eligibleNP = total - referral;
    const d2EligibleNP = eligibleNP - noRof;
    const drH = pts.filter(p => p.doctor === 'Dr.H');
    const drA = pts.filter(p => p.doctor === 'Dr.A');
    return {
      total, closed, completed, d2, noRof, mia, referral, referralOut, eligibleNP, d2EligibleNP,
      closeRate: d2 > 0 ? (closed/d2*100) : 0,
      completionRate: closed > 0 ? (completed/closed*100) : 0,
      d2Rate: d2EligibleNP > 0 ? (d2/d2EligibleNP*100) : 0,
      drH: { total: drH.length, closed: drH.filter(p=>p.closed==='Y').length, completed: drH.filter(p=>p.completed).length, noRof: drH.filter(p=>p.closed==='No ROF').length, eligibleNP: drH.length - drH.filter(p=>p.closed==='No ROF').length },
      drA: { total: drA.length, closed: drA.filter(p=>p.closed==='Y').length, completed: drA.filter(p=>p.completed).length, noRof: drA.filter(p=>p.closed==='No ROF').length, eligibleNP: drA.length - drA.filter(p=>p.closed==='No ROF').length },
    };
  });

  // Source breakdown across all months
  const sourceStats = {};
  NP_SOURCES.forEach(s => { sourceStats[s] = { total: 0, closed: 0, d2: 0, mia: 0 }; });
  allPatients.forEach(p => {
    const s = p.source || 'No Referral Listed';
    if (!sourceStats[s]) sourceStats[s] = { total: 0, closed: 0, d2: 0, mia: 0 };
    sourceStats[s].total++;
    if (p.closed === 'Y') sourceStats[s].closed++;
    if (p.rof) sourceStats[s].d2++;
    if (p.closed === 'MIA') sourceStats[s].mia++;
  });

  const updatePatient = (moIdx, patientId, field, val) => {
    setNpData(prev => {
      const next = prev.map((m, i) => {
        if (i !== moIdx) return m;
        return { ...m, patients: m.patients.map(p => p.id === patientId ? { ...p, [field]: val } : p) };
      });
      return next;
    });
  };

  const deletePatient = (moIdx, patientId) => {
    if (!window.confirm('Remove this patient?')) return;
    setNpData(prev => prev.map((m, i) => i !== moIdx ? m : { ...m, patients: m.patients.filter(p => p.id !== patientId) }));
  };

  const addPatient = () => {
    const newPt = { id: Date.now().toString(), fileNum: '', name: '', date: '', doctor: '', source: '', closed: '', completed: false, rof: false, addedManually: true };
    setNpData(prev => prev.map((m, i) => i !== viewMonth ? m : { ...m, patients: [...(m.patients||[]), newPt] }));
  };

  const yearStats = {
    total: stats.reduce((s,m) => s+m.total, 0),
    noRof: stats.reduce((s,m) => s+m.noRof, 0),
    mia: stats.reduce((s,m) => s+m.mia, 0),
    referral: stats.reduce((s,m) => s+m.referral, 0),
    eligibleNP: stats.reduce((s,m) => s+m.eligibleNP, 0),
    d2EligibleNP: stats.reduce((s,m) => s+m.d2EligibleNP, 0),
    closed: stats.reduce((s,m) => s+m.closed, 0),
    completed: stats.reduce((s,m) => s+m.completed, 0),
    d2: stats.reduce((s,m) => s+m.d2, 0),
    drHTotal: stats.reduce((s,m) => s+m.drH.total, 0),
    drHClosed: stats.reduce((s,m) => s+m.drH.closed, 0),
    drHEligible: stats.reduce((s,m) => s+m.drH.eligibleNP, 0),
    drATotal: stats.reduce((s,m) => s+m.drA.total, 0),
    drAClosed: stats.reduce((s,m) => s+m.drA.closed, 0),
    drAEligible: stats.reduce((s,m) => s+m.drA.eligibleNP, 0),
  };

  const curStats = stats[viewMonth];

  return (
    <div>
      {/* Header */}
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20 }}>
        <div>
          <h2 style={{ fontSize: 20, fontWeight: 700 }}>New Patients</h2>
          <p style={{ color: '#8891aa', fontSize: 13 }}>Upload NP, EPROF & ROF reports via Daily Entry · manually add doctor & close status</p>
        </div>
        <div style={{ display: 'flex', gap: 10 }}>
          <select value={viewMonth} onChange={e => setViewMonth(Number(e.target.value))} style={{ width: 140 }}>
            {MONTH_NAMES.map((m, i) => <option key={m} value={i}>{m}</option>)}
          </select>
          <select value={closedFilter} onChange={e => setClosedFilter(e.target.value)} style={{ width: 130 }}>
            <option value="all">All</option>
            <option value="Y">Closed — Y</option>
            <option value="N">Closed — N</option>
            <option value="No ROF">No ROF</option>
            <option value="MIA">MIA</option>
            <option value="Referral">Referral</option>
            <option value="Referral">Referral</option>
            <option value="">Not Set</option>
          </select>
          <button className="btn btn-primary" onClick={addPatient}>+ Add Patient</button>
        </div>
      </div>

      {/* KPI cards — Year on top, Month below */}
      <div style={{ display: 'flex', gap: 8, marginBottom: 24, overflowX: 'auto' }}>
        {[
          {
            label: 'Show NP',
            yearVal: fmt(yearStats.eligibleNP),
            monthVal: fmt(curStats.eligibleNP),
            color: '#4f8ef7'
          },
          {
            label: 'MIA',
            yearVal: fmt(yearStats.mia),
            monthVal: fmt(curStats.mia),
            color: '#f87171'
          },
          {
            label: 'D2',
            yearVal: `${fmt(yearStats.d2)} (${fmtPct(yearStats.d2EligibleNP > 0 ? yearStats.d2/yearStats.d2EligibleNP*100 : 0)})`,
            monthVal: `${fmt(curStats.d2)} (${fmtPct(curStats.d2Rate)})`,
            color: '#f59e0b'
          },
          {
            label: 'Closed',
            yearVal: `${fmt(yearStats.closed)} (${fmtPct(yearStats.d2 > 0 ? yearStats.closed/yearStats.d2*100 : 0)})`,
            monthVal: `${fmt(curStats.closed)} (${fmtPct(curStats.closeRate)})`,
            color: '#34d399'
          },
          {
            label: 'EPROF',
            yearVal: `${fmt(yearStats.completed)} (${fmtPct(yearStats.closed > 0 ? yearStats.completed/yearStats.closed*100 : 0)})`,
            monthVal: `${fmt(curStats.completed)} (${fmtPct(curStats.completionRate)})`,
            color: '#a78bfa'
          },
          {
            label: 'Dr.H NP',
            yearVal: fmt(yearStats.drHTotal),
            monthVal: fmt(curStats.drH.total),
            color: '#60a5fa'
          },
          {
            label: 'Dr.H Close %',
            yearVal: fmtPct(yearStats.drHEligible > 0 ? yearStats.drHClosed/yearStats.drHEligible*100 : 0),
            monthVal: fmtPct(curStats.drH.eligibleNP > 0 ? curStats.drH.closed/curStats.drH.eligibleNP*100 : 0),
            color: '#60a5fa'
          },
          {
            label: 'Dr.A NP',
            yearVal: fmt(yearStats.drATotal),
            monthVal: fmt(curStats.drA.total),
            color: '#fb923c'
          },
          {
            label: 'Dr.A Close %',
            yearVal: fmtPct(yearStats.drAEligible > 0 ? yearStats.drAClosed/yearStats.drAEligible*100 : 0),
            monthVal: fmtPct(curStats.drA.eligibleNP > 0 ? curStats.drA.closed/curStats.drA.eligibleNP*100 : 0),
            color: '#fb923c'
          },
        ].map(k => (
          <div key={k.label} className="kpi-card" style={{ padding: '10px 12px', textAlign: 'center', minWidth: 90, flex: '1 1 0' }}>
            <div style={{ fontSize: 10, color: '#8891aa', textTransform: 'uppercase', letterSpacing: '.08em', marginBottom: 6 }}>{k.label}</div>
            {/* Year total */}
            <div style={{ fontSize: 11, color: '#555a6e', marginBottom: 2 }}>YTD</div>
            <div style={{ fontSize: 16, fontWeight: 700, color: k.color }}>{k.yearVal}</div>
            {/* Divider */}
            <div style={{ borderTop: '1px solid #2e3247', margin: '6px 0' }} />
            {/* Month total */}
            <div style={{ fontSize: 11, color: '#555a6e', marginBottom: 2 }}>{MONTH_NAMES[viewMonth]}</div>
            <div style={{ fontSize: 13, fontWeight: 600, color: k.color, opacity: 0.85 }}>{k.monthVal}</div>
          </div>
        ))}
      </div>

      {/* Bottom panels */}
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
        {/* Monthly Summary */}
        <div className="kpi-card">
          <div className="section-header">Year Summary by Month</div>
          <div className="table-wrap">
            <table>
              <thead><tr><th style={{ textAlign: 'left' }}>Month</th><th>Scheduled NP</th><th>Show NP</th><th>Referral</th><th>Total NP</th><th>No ROF</th><th>MIA</th><th>D2</th><th>D2%</th><th>Closed</th><th>Close%</th><th>Complete</th><th>Comp%</th></tr></thead>
              <tbody>
                {stats.map((s, i) => (
                  <tr key={i} style={{ cursor: 'pointer', background: i === viewMonth ? '#1a2540' : undefined }} onClick={() => setViewMonth(i)}>
                    <td style={{ textAlign: "center", color: i === viewMonth ? '#4f8ef7' : '#c8cfe0' }}>{MONTHS[i]}</td>
                    <td style={{ padding: 0 }}><input className="cell-input" type="number" value={scheduledNP[i] || ''} placeholder="0" style={{ textAlign: 'center', color: '#60a5fa' }} onChange={e => setScheduledNP(prev => { const n=[...prev]; n[i]=Number(e.target.value); return n; })} /></td>
                    <td style={{ textAlign: "center", color: '#4f8ef7' }}>{s.eligibleNP || '—'}</td>
                    <td style={{ textAlign: "center", color: '#a78bfa' }}>{s.referralOut || '—'}</td>
                    <td style={{ textAlign: "center", color: '#4f8ef7' }}>{fmt(s.eligibleNP - s.referralOut)}</td>
                    <td style={{ textAlign: "center", color: '#f59e0b' }}>{s.noRof || '—'}</td>
                    <td style={{ textAlign: "center", color: '#f87171' }}>{s.mia || '—'}</td>
                    <td style={{ textAlign: "center", color: '#f59e0b' }}>{s.d2 || '—'}</td>
                    <td style={{ textAlign: "center", color: '#f59e0b' }}>{s.d2EligibleNP > 0 ? fmtPct(s.d2Rate) : '—'}</td>
                    <td style={{ textAlign: "center", color: '#34d399' }}>{s.closed || '—'}</td>
                    <td style={{ textAlign: "center", color: '#34d399' }}>{s.d2 > 0 ? fmtPct(s.closeRate) : '—'}</td>
                    <td style={{ textAlign: "center", color: '#a78bfa' }}>{s.completed || '—'}</td>
                    <td style={{ textAlign: "center", color: '#a78bfa' }}>{s.closed > 0 ? fmtPct(s.completionRate) : '—'}</td>
                  </tr>
                ))}
                <tr style={{ fontWeight: 700, borderTop: '1px solid #2e3247' }}>
                  <td style={{ textAlign: "center", color: '#fbbf24' }}>TOTAL</td>
                  <td style={{ textAlign: "center", color: '#60a5fa' }}>{fmt(scheduledNP.reduce((s,n)=>s+n,0))}</td>
                  <td style={{ textAlign: "center", color: '#4f8ef7' }}>{fmt(stats.reduce((s,m)=>s+m.eligibleNP,0))}</td>
                  <td style={{ textAlign: "center", color: '#a78bfa' }}>{fmt(stats.reduce((s,m)=>s+m.referralOut,0))}</td>
                  <td style={{ textAlign: "center", color: '#4f8ef7' }}>{fmt(stats.reduce((s,m)=>s+m.eligibleNP,0) - stats.reduce((s,m)=>s+m.referralOut,0))}</td>
                  <td style={{ textAlign: "center", color: '#f59e0b' }}>{fmt(stats.reduce((s,m)=>s+m.noRof,0))}</td>
                  <td style={{ textAlign: "center", color: '#f87171' }}>{fmt(stats.reduce((s,m)=>s+m.mia,0))}</td>

// ─── BUSINESS REVIEW ──────────────────────────────────────────────────────────
function BusinessReview({ bizReview, setBizReview, monthlyTotals, npStats, npData, autoPayData, marketing, annualGoals, setAnnualGoals, isSandbox }) {
  const update = (i, field, val) => {
    setBizReview(prev => prev.map((m, j) => j !== i ? m : { ...m, [field]: val }));
  };

  const totalNPYear = (npData||[]).reduce((s,m) => s + (m?.patients||[]).length, 0);
  const totalD2Year = (npData||[]).reduce((s,m) => s + (m?.patients||[]).filter(p=>p.rof).length, 0);
  const totalClosesYear = npStats.reduce((s,m) => s + m.activeClose, 0);
  const totalPVYear = monthlyTotals.reduce((s,m) => s + (m.adjustments||0)+(m.decompression||0)+(m.softwave||0), 0);
  const totalCollYear = monthlyTotals.reduce((s,m) => s + m.collections, 0);
  const totalPVvisits = monthlyTotals.reduce((s,m) => s + (m.pv||0), 0);
  const totalMktgYear = bizReview.reduce((s,m,i) => s + ((Number(marketing?.fb?.[i]?.spend)||0)+(Number(marketing?.google?.[i]?.spend)||0)+(Number(marketing?.googleLSA?.[i]?.spend)||0)), 0);
  const totalActiveFinishYear = (npData||[]).reduce((s,m) => s + (m?.patients||[]).filter(p=>p.completed).length, 0);
  const totalWellnessYear = npStats.reduce((s,m) => s + m.wellnessClose, 0);
  const totalInactivesYear = npStats.reduce((s,m) => s + m.inactives, 0);
  const totalLifetimeYear = npStats.reduce((s,m) => s + m.lifetimeClose, 0);

  const rows = [
    { key: "collections",   label: "Collections ($)",    type: "dollar", auto: (i) => monthlyTotals[i].collections },
    { key: "adjustments",   label: "Adj Visits",          type: "int",    auto: (i) => monthlyTotals[i].adjustments },
    { key: "decompression", label: "Decomp Visits",       type: "int",    auto: (i) => monthlyTotals[i].decompression },
    { key: "softwave",      label: "Softwave Visits",     type: "int",    auto: (i) => monthlyTotals[i].softwave },
    { key: "totalPV",       label: "Total PV",            type: "calc",   calc: (m, i) => fmt((monthlyTotals[i].adjustments||0)+(monthlyTotals[i].decompression||0)+(monthlyTotals[i].softwave||0)), total: () => fmt(totalPVYear) },
    { key: "newPatients", label: "New Patients", type: "int", auto: (i) => (npData?.[i]?.patients || []).length },
    { key: "d2", label: "D2", type: "int", auto: (i) => (npData?.[i]?.patients || []).filter(p => p.rof).length, total: () => fmt(totalD2Year) },
    { key: "d2ShowRate", label: "D2 Show %", type: "calc", calc: (m, i) => { const d2=(npData?.[i]?.patients||[]).filter(p=>p.rof).length; const noRof=(npData?.[i]?.patients||[]).filter(p=>p.closed==='No ROF').length; const eligible=(npData?.[i]?.patients||[]).length - noRof; return fmtPct(pct(d2, eligible)); }, total: () => { const totalNoRof=(npData||[]).reduce((s,m)=>s+(m?.patients||[]).filter(p=>p.closed==='No ROF').length,0); return fmtPct(pct(totalD2Year, totalNPYear - totalNoRof)); } },
    { key: "closes", label: "Closes", type: "int", auto: (i) => npStats[i].activeClose },
    { key: "closeRate", label: "Close %", type: "calc", calc: (m, i) => { const d2=(npData?.[i]?.patients||[]).filter(p=>p.rof).length; return fmtPct(pct(npStats[i].activeClose, d2)); }, total: () => fmtPct(pct(totalClosesYear, totalD2Year)) },
    { key: "activeFinish", label: "Active Finish", type: "int", auto: (i) => (npData?.[i]?.patients || []).filter(p => p.completed).length },
    { key: "activeStickRate", label: "Active Stick Rate", type: "calc", calc: (m, i) => { const af=(npData?.[i]?.patients||[]).filter(p=>p.completed).length; return fmtPct(pct(af, npStats[i].activeClose)); }, total: () => fmtPct(pct(totalActiveFinishYear, totalClosesYear)) },
    { key: "wellnessFinish", label: "Wellness Finish", type: "int", auto: (i) => npStats[i].wellnessClose },
    { key: "wellnessStickRate", label: "Wellness Stick Rate", type: "calc", calc: (m, i) => fmtPct(pct(npStats[i].wellnessClose, bizReview[i].activeFinish)), total: () => fmtPct(pct(totalWellnessYear, totalActiveFinishYear)) },
    { key: "lifetimeConversion", label: "Lifetime Conversion", type: "int", auto: (i) => npStats[i].lifetimeClose },
    { key: "inactive", label: "Inactive", type: "int", auto: (i) => npStats[i].inactives },
    { key: "netMomentum", label: "Net Momentum", type: "calc", calc: (m, i) => fmt(npStats[i].activeClose - npStats[i].inactives), total: () => fmt(totalClosesYear - totalInactivesYear) },
    { key: "pva", label: "PVA", type: "calc", calc: (m, i) => { const pv=(monthlyTotals[i].adjustments||0)+(monthlyTotals[i].decompression||0)+(monthlyTotals[i].softwave||0); const np=(npData?.[i]?.patients||[]).length||0; return fmt(pv>0&&np>0?pv/np:0,1); }, total: () => fmt(totalPVYear > 0 && totalNPYear > 0 ? totalPVYear / totalNPYear : 0, 1) },
    { key: "ova", label: "OVA/CVA ($)", type: "calc", calc: (m, i) => fmtDollar(monthlyTotals[i].pv > 0 ? monthlyTotals[i].collections / monthlyTotals[i].pv : 0), total: () => fmtDollar(totalPVvisits > 0 ? totalCollYear / totalPVvisits : 0) },
    { key: "ltv", label: "LTV ($)", type: "calc", calc: (m, i) => { const np=(npData?.[i]?.patients||[]).length; return fmtDollar(np > 0 ? monthlyTotals[i].collections / np : 0); }, total: () => fmtDollar(totalNPYear > 0 ? totalCollYear / totalNPYear : 0) },
    { key: "mktgSpend", label: "MKTG Spend ($)", type: "dollar", auto: (i) => (Number(marketing?.fb?.[i]?.spend)||0) + (Number(marketing?.google?.[i]?.spend)||0) + (Number(marketing?.googleLSA?.[i]?.spend)||0) + (Number(marketing?.seo?.[i]?.spend)||0) },
    { key: "cac", label: "CAC ($)", type: "calc", calc: (m, i) => fmtDollar(npStats[i].activeClose > 0 ? bizReview[i].mktgSpend / npStats[i].activeClose : 0), total: () => fmtDollar(totalClosesYear > 0 ? totalMktgYear / totalClosesYear : 0) },
    { key: "monthlyAutoPays", label: "Monthly Auto Pays", type: "int", auto: (i) => autoPayData?.[i]?.patients || 0 },
    { key: "goal", label: "Monthly Goal ($)", type: "dollar" },
  ];

  const updateGoal = (key, val) => setAnnualGoals(g => ({ ...g, [key]: val }));

  const getTotal = (row) => {
    if (row.type === "calc") return row.total ? row.total() : null;
    return bizReview.reduce((s, m, i) => s + (row.auto ? row.auto(i) : Number(m[row.key])||0), 0);
  };

  const getTotalRaw = (row) => {
    if (row.type === "calc") {
      // return numeric for comparison where possible
      if (!row.total) return null;
      const v = row.total();
      const n = parseFloat(String(v).replace(/[$,%]/g,''));
      return isNaN(n) ? null : n;
    }
    return bizReview.reduce((s, m, i) => s + (row.auto ? row.auto(i) : Number(m[row.key])||0), 0);
  };

  const QUARTERS = [
    { label: "Q1", months: [0,1,2] },
    { label: "Q2", months: [3,4,5] },
    { label: "Q3", months: [6,7,8] },
    { label: "Q4", months: [9,10,11] },
  ];

  // Lower is better keys
  const LOWER_IS_BETTER = ["cac","inactive"];

  // Business days between two dates (Mon-Fri)
  const countBizDays = (start, end) => {
    let count = 0;
    const cur = new Date(start);
    while (cur <= end) {
      const d = cur.getDay();
      if (d !== 0 && d !== 6) count++;
      cur.setDate(cur.getDate() + 1);
    }
    return count;
  };

  // Quarter date ranges for YEAR
  const qDateRanges = [
    { start: new Date(YEAR,0,1),  end: new Date(YEAR,2,31)  },
    { start: new Date(YEAR,3,1),  end: new Date(YEAR,5,30)  },
    { start: new Date(YEAR,6,1),  end: new Date(YEAR,8,30)  },
    { start: new Date(YEAR,9,1),  end: new Date(YEAR,11,31) },
  ];

  const today = new Date();

  // Returns { started, pctElapsed } for a quarter
  const getQPace = (qIdx) => {
    const { start, end } = qDateRanges[qIdx];
    if (today < start) return { started: false, pctElapsed: 0 };
    const totalBiz = countBizDays(start, end);
    const elapsed = countBizDays(start, today < end ? today : end);
    return { started: true, pctElapsed: totalBiz > 0 ? elapsed / totalBiz : 0 };
  };

  // Get raw numeric quarter total for a row
  const AVERAGE_ROWS = ['pva', 'ova', 'ltv', 'closeRate', 'activeStickRate', 'wellnessStickRate', 'cac', 'd2ShowRate'];
  const getQTotalRaw = (row, monthIdxs) => {
    if (row.type === "calc") {
      if (!row.total) return null;
      const nums = monthIdxs.map(i => {
        const v = row.calc(bizReview[i], i);
        const n = parseFloat(String(v).replace(/[$,%]/g,''));
        return isNaN(n) ? 0 : n;
      });
      const activeNums = nums.filter(n => n > 0);
      const isPctQ = String(row.calc(bizReview[monthIdxs[0]], monthIdxs[0])).includes("%");
      // Average rows: use mean of active months instead of sum
      if (row.key === 'pva' || row.key === 'ova' || row.key === 'ltv' || isPctQ) return activeNums.length > 0 ? activeNums.reduce((a,b)=>a+b,0) / activeNums.length : 0;
      return nums.reduce((a,b)=>a+b,0);
    }
    return monthIdxs.reduce((s,i) => s + (row.auto ? row.auto(i) : Number(bizReview[i][row.key])||0), 0);
  };

  // Format quarter total for display
  const getQTotalFmt = (row, monthIdxs) => {
    const raw = getQTotalRaw(row, monthIdxs);
    if (raw === null) return "—";
    const isDollarQ = row.type === "dollar" || (row.type === "calc" && String(row.calc(bizReview[monthIdxs[0]], monthIdxs[0])).includes("$"));
    const isPctQ = row.type === "calc" && String(row.calc(bizReview[monthIdxs[0]], monthIdxs[0])).includes("%");
    if (isDollarQ) return fmtDollar(raw);
    if (isPctQ) return fmtPct(raw);
    return fmt(raw);
  };

  // Returns "green" | "yellow" | "red" | null
  const getQPaceColor = (row, qIdx) => {
    const { started, pctElapsed } = getQPace(qIdx);
    if (!started) return null;
    const annualGoal = Number(annualGoals[row.key]) || 0;
    if (!annualGoal) return null;
    // Average rows compare against the goal directly, not goal/4
    const isAvg = row.key === 'pva' || row.key === 'ova' || row.key === 'ltv' || row.key === 'activeStickRate' || row.key === 'wellnessStickRate' || row.key === 'closeRate' || row.key === 'd2ShowRate';
    const qGoal = isAvg ? annualGoal : annualGoal / 4;
    const actual = getQTotalRaw(row, QUARTERS[qIdx].months);
    if (actual === null) return null;
    const expectedByNow = isAvg ? annualGoal : qGoal * pctElapsed;
    const lowerIsBetter = LOWER_IS_BETTER.includes(row.key);

    if (lowerIsBetter) {
      // Good if actual is at or below pace
      if (actual <= expectedByNow) return "green";
      if (actual <= expectedByNow * 1.2) return "yellow";
      return "red";
    } else {
      // Good if actual is at or above pace
      if (actual >= expectedByNow) return "green";
      if (actual >= expectedByNow * 0.8) return "yellow";
      return "red";
    }
  };

  const getYearPaceColor = (row) => {
    const yearStart = new Date(YEAR, 0, 1);
    const yearEnd = new Date(YEAR, 11, 31);
    if (today < yearStart) return null;
    const totalBiz = countBizDays(yearStart, yearEnd);
    const elapsed = countBizDays(yearStart, today < yearEnd ? today : yearEnd);
    const pctElapsed = totalBiz > 0 ? elapsed / totalBiz : 0;
    const annualGoal = Number(annualGoals[row.key]) || 0;
    if (!annualGoal) return null;
    const actual = getTotalRaw(row);
    if (actual === null) return null;
    // PVA is an average — compare actual directly against goal, not paced
    const expectedByNow = (row.key === 'pva' || row.key === 'ova' || row.key === 'ltv' || row.key === 'activeStickRate' || row.key === 'wellnessStickRate' || row.key === 'closeRate' || row.key === 'd2ShowRate') ? annualGoal : annualGoal * pctElapsed;
    const lowerIsBetter = LOWER_IS_BETTER.includes(row.key);
    if (lowerIsBetter) {
      if (actual <= expectedByNow) return "green";
      if (actual <= expectedByNow * 1.2) return "yellow";
      return "red";
    } else {
      if (actual >= expectedByNow) return "green";
      if (actual >= expectedByNow * 0.8) return "yellow";
      return "red";
    }
  };

  const COLOR_MAP = {
    green:  { bg: "#14532d22", border: "#22c55e", text: "#4ade80", dot: "#22c55e" },
    yellow: { bg: "#45260022", border: "#f59e0b", text: "#fbbf24", dot: "#f59e0b" },
    red:    { bg: "#45090922", border: "#f87171", text: "#f87171", dot: "#f87171" },
    null:   { bg: "transparent", border: "#2e3247", text: "#8891aa", dot: null },
  };

  const [expandedQ, setExpandedQ] = React.useState({ Q1: true, Q2: true, Q3: true, Q4: true });
  const toggleQ = (q) => setExpandedQ(prev => ({ ...prev, [q]: !prev[q] }));

  const chartRows = rows.filter(r => annualGoals[r.key] > 0);

  if (isSandbox) return (
    <div>
      <div style={{ marginBottom: 20, display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
        <div>
          <h2 style={{ fontSize: 20, fontWeight: 700 }}>
            {YEAR} Goals Sandbox
            <span style={{ fontSize: 12, background: "#1a2a1a", color: "#4ade80", border: "1px solid #166534", borderRadius: 20, padding: "2px 10px", marginLeft: 10, fontWeight: 600 }}>SANDBOX</span>
          </h2>
          <p style={{ color: "#8891aa", fontSize: 13, marginTop: 4 }}>Experiment with goals here — data mirrors Business Review but goals are saved separately</p>
        </div>
        <div style={{ marginLeft: "auto", display: "flex", gap: 8 }}>
          {QUARTERS.map((q, qIdx) => {
            // Overall quarter health = best single-color summary across all rows with goals
            const colors = rows.filter(r => annualGoals[r.key] > 0).map(r => getQPaceColor(r, qIdx)).filter(Boolean);
            const overallColor = colors.includes("red") ? "red" : colors.includes("yellow") ? "yellow" : colors.length > 0 ? "green" : null;
            const c = COLOR_MAP[overallColor] || COLOR_MAP[null];
            return (
              <button key={q.label} onClick={() => toggleQ(q.label)}
                style={{ background: c.bg, border: `1px solid ${c.border}`, color: c.text, borderRadius: 8, padding: "5px 14px", fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", transition: "all 0.15s" }}>

      </div>

      <div className="table-wrap">
        <table>
          <thead>
            <tr>
              <th style={{ textAlign: "left", minWidth: 160, position: "sticky", left: 0, background: "#161922", zIndex: 2 }}>Metric</th>

                  const overallColor = rows.filter(r => annualGoals[r.key] > 0).map(r => getQPaceColor(r, qIdx)).filter(Boolean);
                  const qColor = overallColor.includes("red") ? "red" : overallColor.includes("yellow") ? "yellow" : overallColor.length > 0 ? "green" : null;
                  const c = COLOR_MAP[qColor] || COLOR_MAP[null];
                  return (
                    <React.Fragment key={q.label}>
                      {expandedQ[q.label] && MONTHS.slice(q.months[0], q.months[2]+1).map(m => (
                        <th key={m} style={{ color: "#8891aa" }}>{m}</th>
                      ))}
                      <th onClick={() => toggleQ(q.label)} style={{ color: c.text, background: c.bg, cursor: "pointer", whiteSpace: "nowrap", borderLeft: `2px solid ${c.border}`, minWidth: 70 }}>
                        {expandedQ[q.label] ? "▾" : "▸"} {q.label}
                      </th>
                    </React.Fragment>
                  );
                })}
              {(() => {
                const yearColors = rows.filter(r => annualGoals[r.key] > 0).map(r => getYearPaceColor(r)).filter(Boolean);
                const overallYearColor = yearColors.includes("red") ? "red" : yearColors.includes("yellow") ? "yellow" : yearColors.length > 0 ? "green" : null;
                const yc = COLOR_MAP[overallYearColor] || { text: "#fbbf24" };
                return <th style={{ color: yc.text, whiteSpace: "nowrap" }}>YTD Total</th>;
              })()}
              <th style={{ color: "#34d399" }}>Goal</th>
            </tr>
          </thead>
          <tbody>
            {rows.map(row => {
              const isPct = row.type === "calc" && row.total && String(row.total()).includes("%");
              const isDollar = row.type === "dollar" || (row.type === "calc" && row.total && String(row.total()).includes("$"));

              return (
                <tr key={row.key}>
                  <td style={{ color: "#c8cfe0", fontWeight: 500, position: "sticky", left: 0, background: "#0f1117", zIndex: 1 }}>{row.label}</td>
                  {QUARTERS.map((q, qIdx) => (
                    <React.Fragment key={q.label}>
                      {expandedQ[q.label] && q.months.map(i => {
                        if (row.type === "calc") return <td key={i} style={{ color: "#4f8ef7" }}>{row.calc(bizReview[i], i)}</td>;
                        const autoVal = row.auto ? row.auto(i) : null;
                        const val = autoVal !== null ? autoVal : bizReview[i][row.key];
                        if (autoVal !== null) return <td key={i} style={{ color: "#a78bfa" }}>{row.type === "dollar" ? fmtDollar(val) : fmt(val)}</td>;
                        return (
                          <td key={i} style={{ padding: 0 }}>
                            <input className="cell-input" type="number" value={bizReview[i][row.key] || ""} placeholder="0"
                              onChange={e => update(i, row.key, Number(e.target.value))} />

                      })}
                      {/* Quarter total cell with pacing color */}
                      {(() => {
                        const paceColor = getQPaceColor(row, qIdx);
                        const c = COLOR_MAP[paceColor] || COLOR_MAP[null];
                        return (
                          <td onClick={() => toggleQ(q.label)} style={{ color: c.text, background: c.bg, fontWeight: 700, borderLeft: `2px solid ${c.border}`, cursor: "pointer", fontSize: 12, whiteSpace: "nowrap" }}>
                            {paceColor && <span style={{ display: "inline-block", width: 6, height: 6, borderRadius: "50%", background: c.dot, marginRight: 4, verticalAlign: "middle" }} />}
                            {getQTotalFmt(row, q.months)}
                          </td>
                        );
                      })()}
                    </React.Fragment>
                  ))}
                  {/* Year Total */}
                  {(() => {
                    const yearColor = getYearPaceColor(row);
                    const c = COLOR_MAP[yearColor] || COLOR_MAP[null];
                    const totalFmt = row.type === "calc"
                      ? (row.total ? row.total() : "—")
                      : row.type === "dollar"
                        ? fmtDollar(bizReview.reduce((s,m,i) => s+(row.auto?row.auto(i):Number(m[row.key])||0),0))

                    return (
                      <td style={{ color: c.text, background: c.bg, fontWeight: 700, borderLeft: `2px solid ${c.border}`, fontSize: 12, whiteSpace: "nowrap" }}>
                        {yearColor && <span style={{ display: "inline-block", width: 6, height: 6, borderRadius: "50%", background: c.dot, marginRight: 4, verticalAlign: "middle" }} />}

                  })()}
                  {/* Goal */}
                  <td style={{ padding: 0 }}>
                    <input className="cell-input" type="number" value={annualGoals[row.key] || ""} placeholder="—"
                      style={{ color: "#34d399" }}
                      onChange={e => updateGoal(row.key, Number(e.target.value))} />
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {/* Goal Charts */}
      {chartRows.length > 0 && (
        <div style={{ marginTop: 36 }}>
          <div className="section-header">Goal Tracking</div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(280px, 1fr))", gap: 16 }}>
            {chartRows.map(row => {
              const totalRaw = getTotalRaw(row);
              const goal = Number(annualGoals[row.key]) || 0;
              if (!goal || totalRaw === null) return null;
              const lowerIsBetter = ["cac","inactive"].includes(row.key);
              const pctG = Math.min((totalRaw / goal) * 100, 150);
              const onTrack = lowerIsBetter ? totalRaw <= goal : totalRaw >= goal;
              const barColor = onTrack ? "#34d399" : pctG >= 80 ? "#fbbf24" : "#f87171";
              const isDollar = row.type === "dollar" || (row.type === "calc" && row.total && String(row.total()).includes("$"));
              const isPct = row.type === "calc" && row.total && String(row.total()).includes("%");
              const fmtVal = (v) => isDollar ? fmtDollar(v) : isPct ? `${v.toFixed(1)}%` : fmt(v);
              return (
                <div key={row.key} style={{ background: "#1a1d27", borderRadius: 10, padding: "14px 16px", border: "1px solid #2a2d3e" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
                    <div style={{ fontSize: 12, color: "#8891aa", fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.08em" }}>{row.label}</div>
                    <div style={{ fontSize: 11, color: onTrack ? "#34d399" : "#f87171", fontWeight: 700 }}>{onTrack ? "ON TRACK" : "BEHIND"}</div>
                  </div>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                    <div style={{ fontSize: 18, fontWeight: 700, color: "#e2e8f0" }}>{fmtVal(totalRaw)}</div>
                    <div style={{ fontSize: 12, color: "#8891aa" }}>Goal: <span style={{ color: "#34d399" }}>{fmtVal(goal)}</span></div>
                  </div>
                  <div style={{ background: "#0d0f1a", borderRadius: 4, height: 8, overflow: "hidden" }}>
                    <div style={{ width: `${Math.min(pctG,100)}%`, height: "100%", background: barColor, borderRadius: 4, transition: "width 0.4s ease" }} />
                  </div>
                  <div style={{ fontSize: 11, color: "#8891aa", marginTop: 5, textAlign: "right" }}>{pctG.toFixed(0)}% of goal</div>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );

  // ── Non-sandbox (Business Review) layout ──
  return (
    <div>
      <div style={{ marginBottom: 20 }}>
        <h2 style={{ fontSize: 20, fontWeight: 700 }}>{YEAR} Business Review</h2>
        <p style={{ color: "#8891aa", fontSize: 13 }}>KPI scorecard — auto-calculated fields shown in blue &nbsp;|&nbsp; Enter annual goals in the Goal column</p>
      </div>
      <div className="table-wrap">
        <table>
          <thead>
            <tr>
              <th style={{ textAlign: "left", minWidth: 160 }}>Metric</th>
              {MONTHS.map(m => <th key={m}>{m}</th>)}
              <th style={{ color: "#fbbf24" }}>Total</th>
              <th style={{ color: "#34d399" }}>Goal</th>
              <th style={{ color: "#fb923c" }}>vs Goal</th>
            </tr>
          </thead>
          <tbody>
            {rows.map(row => {
              const totalRaw = getTotalRaw(row);
              const goal = Number(annualGoals[row.key]) || 0;
              const hasGoal = goal > 0;
              const isPct = row.type === "calc" && row.total && String(row.total()).includes("%");
              const isDollar = row.type === "dollar" || (row.type === "calc" && row.total && String(row.total()).includes("$"));
              const diff = hasGoal && totalRaw !== null ? totalRaw - goal : null;
              const pctOfGoal = hasGoal && totalRaw !== null ? (totalRaw / goal) * 100 : null;
              // For costs (CPO, CAC, OVA, LTV) lower is better
              const lowerIsBetter = ["cac","inactive"].includes(row.key);
              const onTrack = diff !== null ? (lowerIsBetter ? diff <= 0 : diff >= 0) : null;

              return (
                <tr key={row.key}>
                  <td style={{ color: "#c8cfe0", fontWeight: 500 }}>{row.label}</td>
                  {bizReview.map((m, i) => {
                    if (row.type === "calc") {
                      return <td key={i} style={{ color: "#4f8ef7" }}>{row.calc(m, i)}</td>;
                    }
                    const autoVal = row.auto ? row.auto(i) : null;
                    const val = autoVal !== null ? autoVal : m[row.key];
                    if (autoVal !== null) {
                      return <td key={i} style={{ color: "#a78bfa" }}>{row.type === "dollar" ? fmtDollar(val) : fmt(val)}</td>;
                    }
                    return (
                      <td key={i} style={{ padding: 0 }}>
                        <input className="cell-input" type="number" value={m[row.key] || ""} placeholder="0"
                          onChange={e => update(i, row.key, Number(e.target.value))} />
                      </td>
                    );
                  })}
                  {/* Total */}
                  <td style={{ textAlign: "center", color: "#fbbf24" }}>
                    {row.type === "calc"
                      ? (row.total ? row.total() : "—")
                      : row.type === "dollar"
                        ? fmtDollar(bizReview.reduce((s, m, i) => s + (row.auto ? row.auto(i) : Number(m[row.key])||0), 0))
                        : fmt(bizReview.reduce((s, m, i) => s + (row.auto ? row.auto(i) : Number(m[row.key])||0), 0))
                    }
                  </td>
                  {/* Goal — editable input */}
                  <td style={{ padding: 0 }}>
                    <input className="cell-input" type="number" value={annualGoals[row.key] || ""} placeholder="—"
                      style={{ color: "#34d399" }}
                      onChange={e => updateGoal(row.key, Number(e.target.value))} />
                  </td>
                  {/* vs Goal */}
                  <td style={{ textAlign: "center", color: onTrack === null ? "#555" : onTrack ? "#34d399" : "#f87171", fontWeight: 600, fontSize: 12 }}>
                    {diff === null ? "—" : (
                      <span>
                        {onTrack ? "✓" : "✗"}&nbsp;
                        {isDollar ? fmtDollar(Math.abs(diff)) : isPct ? `${Math.abs(diff).toFixed(1)}%` : fmt(Math.abs(diff))}
                        &nbsp;<span style={{ fontSize: 10, opacity: 0.7 }}>({pctOfGoal !== null ? `${pctOfGoal.toFixed(0)}%` : ""})</span>
                      </span>
                    )}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {/* ── GOAL CHARTS ── */}
      {chartRows.length > 0 && (
        <div style={{ marginTop: 36 }}>
          <div className="section-header">Goal Tracking</div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(280px, 1fr))", gap: 16 }}>
            {chartRows.map(row => {
              const totalRaw = getTotalRaw(row);
              const goal = Number(annualGoals[row.key]) || 0;
              if (!goal || totalRaw === null) return null;
              const lowerIsBetter = ["cac","inactive"].includes(row.key);
              const pct = Math.min((totalRaw / goal) * 100, 150);
              const onTrack = lowerIsBetter ? totalRaw <= goal : totalRaw >= goal;
              const barColor = onTrack ? "#34d399" : pct >= 80 ? "#fbbf24" : "#f87171";
              const isDollar = row.type === "dollar" || (row.type === "calc" && row.total && String(row.total()).includes("$"));
              const isPct = row.type === "calc" && row.total && String(row.total()).includes("%");
              const fmtVal = (v) => isDollar ? fmtDollar(v) : isPct ? `${v.toFixed(1)}%` : fmt(v);

              return (
                <div key={row.key} style={{ background: "#1a1d27", borderRadius: 10, padding: "14px 16px", border: "1px solid #2a2d3e" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 8 }}>
                    <div style={{ fontSize: 12, color: "#8891aa", fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.08em" }}>{row.label}</div>
                    <div style={{ fontSize: 11, color: onTrack ? "#34d399" : "#f87171", fontWeight: 700 }}>{onTrack ? "ON TRACK" : "BEHIND"}</div>
                  </div>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                    <div style={{ fontSize: 18, fontWeight: 700, color: "#e2e8f0" }}>{fmtVal(totalRaw)}</div>
                    <div style={{ fontSize: 12, color: "#8891aa" }}>Goal: <span style={{ color: "#34d399" }}>{fmtVal(goal)}</span></div>
                  </div>
                  <div style={{ background: "#0d0f1a", borderRadius: 4, height: 8, overflow: "hidden" }}>
                    <div style={{ width: `${Math.min(pct, 100)}%`, height: "100%", background: barColor, borderRadius: 4, transition: "width 0.4s ease" }} />
                  </div>
                  <div style={{ fontSize: 11, color: "#8891aa", marginTop: 5, textAlign: "right" }}>{pct.toFixed(0)}% of goal</div>
                </div>
              );
            })}
