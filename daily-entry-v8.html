    function today() {
      return new Date().toISOString().split("T")[0];
    }
    function formatDate(d) {
      if (!d) return "";
      return new Date(d + "T00:00:00").toLocaleDateString("en-US", { weekday:"long", month:"long", day:"numeric", year:"numeric" });
    }

    // ── PDF TEXT EXTRACTOR ──────────────────────────────────────────────────
    async function extractPDFText(file) {
      const buf = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
      let text = "";
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        text += content.items.map(item => item.str).join(" ") + "\n";
      }
      return text;
    }

    // ── DATE PARSER ─────────────────────────────────────────────────────────
    function parseDateFromPDF(text) {
      // PDF has two dates: "printed on 05/01/26" then "04/01/26" (the report date)
      // Skip the "printed on" date and grab the SECOND date
      const all = [...text.matchAll(/(\d{2})\/(\d{2})\/(\d{2})/g)];
      if (all.length < 2) return null;
      const m = all[1]; // second date is the report date
      const mo = m[1], dy = m[2], yr = "20" + m[3];
      return `${yr}-${mo}-${dy}`;
    }

    // ── COLLECTIONS PDF PARSER ──────────────────────────────────────────────
    function parseCollections(text) {
      // Split text into sections by header keywords
      const cashStart   = text.indexOf('CASH RECEIVED');
      const insStart    = text.indexOf('INSURANCE');
      const refundStart = text.indexOf('REFUNDS');
      const creditStart = text.indexOf('CREDITS AND WRITE OFFS');

      const cashSection   = cashStart   > -1 ? text.substring(cashStart,   insStart    > -1 ? insStart    : undefined) : '';
      const insSection    = insStart    > -1 ? text.substring(insStart,     refundStart > -1 ? refundStart : undefined) : '';
      const refundSection = refundStart > -1 ? text.substring(refundStart,  creditStart > -1 ? creditStart : undefined) : '';

      function getAmt(section, label) {
        const re = new RegExp(label.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '[^\\d]*([\\d,]+\\.?\\d*)', 'i');
        const m = section.match(re);
        return m ? parseFloat(m[1].replace(/,/g,'')) || 0 : 0;
      }

      // CC: card brands from CASH RECEIVED section only
      const amex     = getAmt(cashSection, 'American Express');
      const discover = getAmt(cashSection, 'Discover');
      const mc       = getAmt(cashSection, 'MasterCard');
      const visa     = getAmt(cashSection, 'Visa');

      // Cash: must match "Cash NNN transactions" pattern (not "CASH RECEIVED" header)
      let cash = 0;
      const cashMatch = cashSection.match(/\bCash\b\s+([\d,]+\.?\d*)\s+\d+\s+transactions/i);
      if (cashMatch) cash = parseFloat(cashMatch[1].replace(/,/g,'')) || 0;

      // Checks: standalone "Check" line (not Insurance Check) in CASH RECEIVED
      let checks = 0;
      const checkMatch = cashSection.match(/\bCheck\b\s+([\d,]+\.?\d*)\s+\d+\s+transactions/i);
      if (checkMatch) checks = parseFloat(checkMatch[1].replace(/,/g,'')) || 0;

      // Insurance: from INSURANCE section only
      const acheft = getAmt(insSection, 'ACH / EFT');
      const inschk = getAmt(insSection, 'Insurance Check');

      // Refund: from REFUNDS section only
      let refund = 0;
      const refundMatch = refundSection.match(/Total\s+([\d,]+\.?\d*)/i);
      if (refundMatch && refundMatch[1] !== '---') {
        refund = parseFloat(refundMatch[1].replace(/,/g,'')) || 0;
      }

      return {
        cc:     amex + discover + mc + visa,
        cash:   cash,
        checks: checks,
        ins:    acheft + inschk,
        refund: refund,
      };
    }

    // ── APPOINTMENTS PDF PARSER ─────────────────────────────────────────────
    function parseAppointments(text) {
      // CPT code counts — find "CODE ... Count" column
      function getCPTCount(code) {
        // pattern: code name ... number number number
        const re = new RegExp(code + '\\s+[\\w\\s/]+?\\s+(\\d+)\\s+', 'i');
        const m = text.match(re);
        return m ? parseInt(m[1]) || 0 : 0;
      }
      function getNamedCount(name) {
        const re = new RegExp(name + '\\s+(\\d+)\\s+', 'i');
        const m = text.match(re);
        return m ? parseInt(m[1]) || 0 : 0;
      }
      function getStat(label) {
        const re = new RegExp(label + '\\s+(\\d+)', 'i');
        const m = text.match(re);
        return m ? parseInt(m[1]) || 0 : 0;
      }
      function getGrossTotal() {
        // Strip inventory section before finding gross total
        // Pattern: services Total ... [INVENTORY SECTION] ... Net Total
        let cleanText = text;
        const invIdx = text.search(/SUMMARY OF INVENTORY SALES/i);
        if (invIdx > -1) {
          const netIdx = text.search(/Net Total/i);
          if (netIdx > invIdx) {
            cleanText = text.substring(0, invIdx) + text.substring(netIdx);
          }
        }
        // Gross total is the dollar amount immediately before "Net Total"
        const m = cleanText.match(/([\d,]+\.\d{2})\s*Net Total/i);
        if (m) return parseFloat(m[1].replace(/,/g,"")) || 0;
        return 0;
      }

      // Decompression — count first so we can subtract from adjustments
      const decomp      = getNamedCount('Decompression');
      const trialDecomp = getNamedCount('Trial Decompression');
      const totalDecomp = decomp + trialDecomp;

      // Softwave
      const softwave = getCPTCount('0101T');

      // NP CPTs
      const np99202 = getCPTCount('99202');
      const np99203 = getCPTCount('99203');
      const np99204 = getCPTCount('99204');
      const np99205 = getCPTCount('99205');
      const np = np99202 + np99203 + np99204 + np99205;

      // Adjustments — scan tokens using CPT codes directly
      // Use S8990 for Wellness Adjustment (not the name which has spaces)
      const tokens = text.split(/\s+/);
      let adj98940 = 0, adj98941 = 0, adj98942 = 0, wellAdj = 0;

      function getCountAfter(i) {
        for (let j = i; j < Math.min(i + 10, tokens.length); j++) {
          if (/^\d+$/.test(tokens[j])) return parseInt(tokens[j]);
        }
        return 0;
      }

      for (let i = 0; i < tokens.length; i++) {
        if (tokens[i] === '98940') adj98940 += getCountAfter(i + 1);
        if (tokens[i] === '98941') adj98941 += getCountAfter(i + 1);
        if (tokens[i] === '98942') adj98942 += getCountAfter(i + 1);
        if (tokens[i] === 'S8990') wellAdj   += getCountAfter(i + 1);
      }

      // Adjustments = (98940 + 98941 + 98942 + S8990) - Decompression
      const adjTotal = (adj98940 + adj98941 + adj98942 + wellAdj) - totalDecomp;

      // Appointment stats
      const scheduled = getStat('Total Scheduled');
      const ma        = getStat('Missed');
      const rs        = getStat('Rescheduled');
      const wi        = getStat('Walk-in');
      const services  = getGrossTotal();

      return {
        scheduled,
        pv:         adjTotal + totalDecomp + softwave,
        adjustments: adjTotal,
        decompression: totalDecomp,
        softwave,
        np,
        ma,
        rs,
        wi,
        services,
      };
    }

    // ── FIELD CONFIG ────────────────────────────────────────────────────────
    const VISIT_FIELDS = [
      { key:"scheduled",    label:"Scheduled",          icon:"📋", color:"#a78bfa" },
      { key:"pv",           label:"Total Patient Visits",icon:"🧑‍⚕️", color:"#4f8ef7" },

    const COLLECTION_FIELDS = [

    // ── MAIN APP ────────────────────────────────────────────────────────────
    function App() {
      const [date, setDate] = useState(today());
      const [values, setValues] = useState({});
      const [apptFile, setApptFile]  = useState(null);
      const [collFile, setCollFile]  = useState(null);
      const [autoPayFile, setAutoPayFile] = useState(null);
      const [npFile, setNpFile] = useState(null);
      const [eprofFile, setEprofFile] = useState(null);
      const [apptDragOver, setApptDragOver] = useState(false);
      const [collDragOver, setCollDragOver] = useState(false);
      const [autoPayDragOver, setAutoPayDragOver] = useState(false);
      const [npDragOver, setNpDragOver] = useState(false);
      const [eprofDragOver, setEprofDragOver] = useState(false);
      const [autoPayParsing, setAutoPayParsing] = useState(false);
      const [autoPayDone, setAutoPayDone] = useState(false);
      const [npParsing, setNpParsing] = useState(false);
      const [npDone, setNpDone] = useState(false);
      const [eprofParsing, setEprofParsing] = useState(false);
      const [eprofDone, setEprofDone] = useState(false);
      const [npResults, setNpResults] = useState(null);
      const [eprofResults, setEprofResults] = useState(null);
      const [apptParsing, setApptParsing] = useState(false);
      const [collParsing, setCollParsing] = useState(false);
      const [apptDone,    setApptDone]    = useState(false);
      const [collDone,    setCollDone]    = useState(false);
      const [submitting,  setSubmitting]  = useState(false);
      const [submitted,   setSubmitted]   = useState(false);
      const [error,       setError]       = useState("");

      const set = (key, val) => setValues(prev => ({ ...prev, [key]: val }));

      const collections = (Number(values.cc)||0) + (Number(values.cash)||0) + (Number(values.checks)||0) + (Number(values.ins)||0);

      async function handleApptPDF(file) {
        setApptFile(file); setApptParsing(true); setError("");
        try {
          const text = await extractPDFText(file);
          const parsed = parseAppointments(text);
          const parsedDate = parseDateFromPDF(text);
          if (parsedDate) setDate(parsedDate);
          setValues(prev => ({ ...prev, ...parsed }));
          setApptDone(true);
        } catch(e) { setError("Could not read appointments PDF: " + e.message); }
        setApptParsing(false);
      }

      async function handleCollPDF(file) {
        setCollFile(file); setCollParsing(true); setError("");
        try {
          const text = await extractPDFText(file);
          const parsed = parseCollections(text);
          const parsedDate = parseDateFromPDF(text);
          if (parsedDate) setDate(parsedDate);
          setValues(prev => ({ ...prev, ...parsed }));
          setCollDone(true);
        } catch(e) { setError("Could not read collections PDF. Please check the file."); }
        setCollParsing(false);
      }

      // ── NP / EPROF PDF PARSERS ─────────────────────────────────────────────
      const SOURCE_MAP = {
        'internet': 'Internet', 'patient referral': 'Patient Referral',
        'doctor referral': 'Doctor Referral', 'facebook ad': 'Facebook Ad',
        'google ad': 'Google Ad', 'google lsa call': 'Google LSA',
        'google lsa': 'Google LSA', 'website scheduling page': 'Website',
        'insurance referral': 'Insurance Referral', 'no referral listed': 'Unknown', '': 'Unknown'
      };
      function mapSource(raw) {
        const key = (raw||'').trim().toLowerCase();
        return SOURCE_MAP[key] || (key ? raw.trim() : 'Unknown');
      }

      function parseNPReport(text) {
        // Detect month from date range header e.g. "04/01/26 - 04/30/26"
        var drMatch = text.match(/(\d{2})\/\d{2}\/\d{2}\s*-\s*\d{2}\/\d{2}\/\d{2}/);
        var month = drMatch ? parseInt(drMatch[1]) - 1 : null;

        // Clean page break noise
        var t = text.replace(/Page\s+\d+\s+of\s+\d+/gi, ' ')
                    .replace(/ID\s+Patient[\s\S]*?Referral Source/gi, ' ');

        // Match each patient row: ID LastName, FirstName email phone date source
        var rows = [];
        var re = /(\d{4,5})\s+([A-Z][a-zA-Z’]+(?:\s+[A-Za-z’]+)*,\s+[A-Za-z\s]+?)\s+\S+@\S+\s+\(\d{3}\)\s+\d{3}-\d{4}\s+(\d{2}\/\d{2}\/\d{4})\s*(?:W[^(]*?)?\s*…?\s*(?:…\s*)?([\w\s\/]*?)(?=\s*\d{4,5}\s+[A-Z]|\s*Total:|\s*Referral\s+Analysis|$)/g;
        var m;
        while ((m = re.exec(t)) !== null) {
          rows.push({
            id: Date.now().toString() + Math.random().toString(36).slice(2),
            fileNum: m[1],
            name: m[2].trim(),
            date: m[3],
            source: mapSource((m[4]||'').trim()),
            doctor: '', closed: '', completed: false
          });
        }
        return { month: month, patients: rows };
      }

      function parseEPROFReport(text) {
        // Same format - extract patient IDs
        const ids = [];
        const lines = text.split(/\n/);
        for (const line of lines) {
          const m = line.match(/^(\d{4,5})\s+[A-Z]/);
          if (m) ids.push(m[1]);
        }
        return ids;
      }

      async function handleNPPDF(file) {
        setNpFile(file); setNpParsing(true); setError('');
        try {
          const text = await extractPDFText(file);
          const parsed = parseNPReport(text);
          if (parsed.patients.length === 0) { setError('No patients found in NP report. Check the file.'); setNpParsing(false); return; }
          setNpResults(parsed);
          setNpDone(true);
        } catch(e) { setError('Error reading NP PDF: ' + e.message); }
        setNpParsing(false);
      }

      async function handleEPROFPDF(file) {
        setEprofFile(file); setEprofParsing(true); setError('');
        try {
          const text = await extractPDFText(file);
          const ids = parseEPROFReport(text);
          if (ids.length === 0) { setError('No patients found in EPROF report.'); setEprofParsing(false); return; }
          setEprofResults(ids);
          setEprofDone(true);
        } catch(e) { setError('Error reading EPROF PDF: ' + e.message); }
        setEprofParsing(false);
      }

      // ── CSV PARSER ─────────────────────────────────────────────────────────
      function parseAutoPayCSV(text) {
        const lines = text.trim().split(/\r?\n/);
        if (lines.length < 2) return null;
        const headers = lines[0].split(',').map(h => h.trim().replace(/"/g,''));
        const firstNameIdx = headers.findIndex(h => h.toLowerCase() === 'firstname');
        const amountIdx = headers.findIndex(h => h.toLowerCase() === 'amount');
        const nextPayIdx = headers.findIndex(h => h.toLowerCase() === 'nextpaymentdate');
        if (firstNameIdx === -1 || amountIdx === -1) return null;

        const rows = lines.slice(1).filter(l => l.trim());
        let totalPatients = 0;
        let totalAmount = 0;
        const monthCounts = {};

        rows.forEach(line => {
          const cols = line.split(',');
          const firstName = cols[firstNameIdx]?.replace(/"/g,'').trim();
          const amount = parseFloat(cols[amountIdx]?.replace(/"/g,'').trim()) || 0;
          const nextPay = cols[nextPayIdx]?.replace(/"/g,'').trim();
          if (firstName) { totalPatients++; totalAmount += amount; }
          if (nextPay) {
            const mo = nextPay.split('/')[0];
            monthCounts[mo] = (monthCounts[mo] || 0) + 1;
          }
        });

        // Auto-detect month — most common NextPaymentDate month
        let detectedMonth = null;
        if (Object.keys(monthCounts).length > 0) {
          detectedMonth = Object.entries(monthCounts).sort((a,b) => b[1]-a[1])[0][0];
        }

        return { totalPatients, totalAmount, detectedMonth };
      }

      async function handleAutoPayCSV(file) {
        setAutoPayFile(file); setAutoPayParsing(true); setError("");
        try {
          const text = await file.text();
          const parsed = parseAutoPayCSV(text);
          if (!parsed) { setError("Could not read Auto Pays CSV. Check the file format."); setAutoPayParsing(false); return; }
          // Store in values for submission
          setValues(prev => ({ ...prev, autoPayPatients: parsed.totalPatients, autoPayAmount: parsed.totalAmount, autoPayMonth: parsed.detectedMonth }));
          setAutoPayDone(true);
        } catch(e) { setError("Error reading CSV: " + e.message); }
        setAutoPayParsing(false);
      }

      async function handleSubmit() {
        setSubmitting(true); setError("");
        try {
          // Generate full 2026 business days (same logic as main app)
          function gen2026Days() {
            const weeks = [];
            let cur = new Date(2026, 0, 1);
            while (cur.getFullYear() === 2026) {
              const weekDays = [];
              const weekStart = new Date(cur);
              while (weekDays.length < 5 && cur.getFullYear() === 2026) {
                const dow = cur.getDay();
                if (dow !== 0 && dow !== 6) {
                  weekDays.push({
                    date: cur.toISOString(),
                    label: `${cur.getMonth()+1}/${cur.getDate()}`,
                    month: cur.getMonth(),
                    scheduled:0,pv:0,adjustments:0,decompression:0,softwave:0,
                    np:0,mnp:0,ma:0,rs:0,wi:0,services:0,checks:0,cash:0,cc:0,ins:0,pi:0,supplements:0
                  });
                }
                cur.setDate(cur.getDate() + 1);
                if (cur.getDay() === 1 && weekDays.length > 0) break;
              }
              if (weekDays.length > 0) {
                const we = weekDays[weekDays.length-1];
                const wl = weekDays[0];
                weeks.push({
                  label: `${wl.month+1}/${wl.label.split('/')[1]}-${we.month+1}/${we.label.split('/')[1]}`,
                  days: weekDays
                });
              }
            }
            return weeks;
          }

          const docRef = db.collection("chiro2026").doc("2026");
          const snap = await docRef.get();
          const data = snap.exists ? snap.data() : {};

          // Use saved weeks or generate fresh ones
          let weeks = (data.dailyWeeks && data.dailyWeeks.length > 0) ? data.dailyWeeks : gen2026Days();

          // Find matching day by label
          const [yr, mo, dy] = date.split("-").map(Number);
          const label = `${mo}/${dy}`;
          let found = false;

          weeks = weeks.map(week => ({
            ...week,
            days: week.days.map(day => {
              if (day.label === label) {
                found = true;
                return {
                  ...day,
                  scheduled:    Number(values.scheduled)    || 0,
                  pv:           Number(values.pv)           || 0,
                  adjustments:  Number(values.adjustments)  || 0,
                  decompression:Number(values.decompression)|| 0,
                  softwave:     Number(values.softwave)     || 0,
                  np:           Number(values.np)           || 0,
                  ma:           Number(values.ma)           || 0,
                  rs:           Number(values.rs)           || 0,
                  wi:           Number(values.wi)           || 0,
                  services:     Number(values.services)     || 0,
                  cc:           Number(values.cc)           || 0,
                  cash:         Number(values.cash)         || 0,
                  checks:       Number(values.checks)       || 0,
                  ins:          Number(values.ins)          || 0,
                };
              }
              return day;
            })
          }));

          if (!found) { setError(`Could not find ${label} in the schedule. Date not in 2026 calendar.`); setSubmitting(false); return; }

          await docRef.set({ dailyWeeks: weeks }, { merge: true });

          // Save NP report if uploaded
          if (npResults && npResults.patients.length > 0 && npResults.month !== null) {
            const npData = snap.exists ? (snap.data().npData || Array(12).fill(null).map(()=>({patients:[]}))) : Array(12).fill(null).map(()=>({patients:[]}));
            const moIdx = npResults.month;
            // Merge: avoid duplicates by fileNum
            const existing = npData[moIdx]?.patients || [];
            const existingNums = new Set(existing.map(p => p.fileNum));
            const newOnes = npResults.patients.filter(p => !existingNums.has(p.fileNum));
            npData[moIdx] = { patients: [...existing, ...newOnes] };
            await docRef.set({ npData }, { merge: true });
          }

          // Save EPROF completions if uploaded - find patients across all months
          if (eprofResults && eprofResults.length > 0) {
            const npData = snap.exists ? (snap.data().npData || Array(12).fill(null).map(()=>({patients:[]}))) : Array(12).fill(null).map(()=>({patients:[]}));
            const eprofSet = new Set(eprofResults);
            let updated = false;
            npData.forEach((mo, i) => {
              if (!mo?.patients) return;
              mo.patients = mo.patients.map(p => {
                if (eprofSet.has(p.fileNum) && !p.completed) { updated = true; return { ...p, completed: true }; }
                return p;
              });
            });
            if (updated) await docRef.set({ npData }, { merge: true });
          }

          // Save auto pay data if uploaded
          if (values.autoPayPatients && values.autoPayMonth) {
            const moIdx = parseInt(values.autoPayMonth) - 1;
            const autoPayData = snap.exists ? (snap.data().autoPayData || Array(12).fill(null)) : Array(12).fill(null);
            autoPayData[moIdx] = { patients: values.autoPayPatients, amount: values.autoPayAmount };
            await docRef.set({ autoPayData }, { merge: true });
          }

          // Save refund to bonuses if present
          if (Number(values.refund) > 0) {
            const monthIndex = mo - 1;
            const bonuses = data.bonuses || { baseline: 80000, team: [], docs: [], refunds: Array(12).fill({month:"",total:0,note:""}) };
            if (bonuses.refunds && bonuses.refunds[monthIndex] !== undefined) {
              bonuses.refunds[monthIndex] = {
                ...bonuses.refunds[monthIndex],
                total: (Number(bonuses.refunds[monthIndex].total)||0) + Number(values.refund),
                note: bonuses.refunds[monthIndex].note ? bonuses.refunds[monthIndex].note + `, +$${values.refund}` : `$${values.refund}`
              };
              await docRef.set({ bonuses }, { merge: true });
            }
          }

          setSubmitted(true);
        } catch(e) {
          setError("Error saving to database: " + e.message);
        }
        setSubmitting(false);
      }

      function handleReset() {
        setValues({}); setDate(today());
        setApptFile(null); setCollFile(null); setAutoPayFile(null); setNpFile(null); setEprofFile(null);
        setApptDone(false); setCollDone(false); setAutoPayDone(false); setNpDone(false); setEprofDone(false);
        setNpResults(null); setEprofResults(null);
        setSubmitted(false); setError("");
      }

      // ── SUBMITTED SCREEN ────────────────────────────────────────────────
      if (submitted) return (
        <div style={{fontFamily:"'DM Sans',sans-serif",background:"#0f1117",minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24,color:"#e8eaf0"}}>
          <div style={{fontSize:64,marginBottom:16}}>✅</div>
          <h1 style={{fontSize:24,fontWeight:700,marginBottom:8,color:"#34d399"}}>Stats Submitted!</h1>
          <p style={{color:"#8891aa",marginBottom:4,fontSize:15}}>{formatDate(date)}</p>
          <p style={{color:"#8891aa",marginBottom:32,fontSize:13}}>Data saved to the dashboard.</p>
          <div style={{background:"#161922",border:"1px solid #2e3247",borderRadius:16,padding:24,width:"100%",maxWidth:360,marginBottom:24}}>
            <div style={{fontSize:11,color:"#8891aa",textTransform:"uppercase",letterSpacing:".08em",marginBottom:12}}>Summary</div>
            {autoPayDone&&<div style={{display:"flex",justifyContent:"space-between",fontSize:14,padding:"6px 0",borderBottom:"1px solid #1e2130"}}><span style={{color:"#8891aa"}}>Auto Pay Patients</span><span style={{color:"#a78bfa",fontWeight:600}}>{values.autoPayPatients}</span></div>}
            {autoPayDone&&<div style={{display:"flex",justifyContent:"space-between",fontSize:14,padding:"6px 0",borderBottom:"1px solid #1e2130"}}><span style={{color:"#8891aa"}}>Auto Pay Amount</span><span style={{color:"#a78bfa",fontWeight:600}}>${Number(values.autoPayAmount).toLocaleString()}</span></div>}
            {[...VISIT_FIELDS,...COLLECTION_FIELDS].filter(f=>Number(values[f.key])>0).map(f=>(
              <div key={f.key} style={{display:"flex",justifyContent:"space-between",fontSize:14,padding:"6px 0",borderBottom:"1px solid #1e2130"}}>
                <span style={{color:"#8891aa"}}>{f.label}</span>
                <span style={{color:f.color,fontWeight:600}}>{f.dollar?`$${Number(values[f.key]).toLocaleString("en-US",{minimumFractionDigits:2})}`:values[f.key]}</span>
              </div>
            ))}
            <div style={{display:"flex",justifyContent:"space-between",fontSize:15,padding:"10px 0 0",fontWeight:700}}>
              <span style={{color:"#8891aa"}}>Total Collections</span>
              <span style={{color:"#4f8ef7"}}>${collections.toLocaleString("en-US",{minimumFractionDigits:2})}</span>
            </div>
          </div>
          <button onClick={handleReset} style={{background:"#4f8ef7",color:"white",border:"none",borderRadius:12,padding:"14px 32px",fontSize:16,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>Enter Another Day</button>
        </div>
      );

      // ── MAIN FORM ───────────────────────────────────────────────────────
      return (
        <div style={{fontFamily:"'DM Sans',sans-serif",background:"#0f1117",minHeight:"100vh",color:"#e8eaf0"}}>
          {/* Header */}
          <div style={{background:"#0d0f18",borderBottom:"1px solid #1e2130",padding:"16px 20px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <div style={{width:32,height:32,background:"linear-gradient(135deg,#4f8ef7,#a78bfa)",borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>⬡</div>
              <div>
                <div style={{fontWeight:700,fontSize:15}}>ChiroStats <span style={{color:"#4f8ef7"}}>2026</span></div>
                <div style={{fontSize:11,color:"#8891aa"}}>Daily Entry</div>
              </div>
            </div>
            <div style={{fontSize:12,color:"#8891aa"}}>Staff Portal</div>
          </div>

          <div style={{maxWidth:500,margin:"0 auto",padding:"24px 16px 80px"}}>

            {/* Error */}
            {error && <div style={{background:"#3a1a1a",border:"1px solid #7f1d1d",borderRadius:12,padding:"12px 16px",marginBottom:16,color:"#f87171",fontSize:14}}>{error}</div>}

            {/* Date */}
            <div style={{background:"#161922",border:"1px solid #2e3247",borderRadius:16,padding:20,marginBottom:16}}>
              <div style={{fontSize:11,color:"#8891aa",textTransform:"uppercase",letterSpacing:".08em",marginBottom:8}}>Date — pulled from PDF automatically</div>
              {date
                ? <div style={{fontSize:18,fontWeight:700,color:"#4f8ef7"}}>{formatDate(date)}</div>
                : <div style={{fontSize:14,color:"#8891aa"}}>Upload a PDF to set the date automatically</div>
              }
            </div>

            {/* PDF Uploads */}
            <div style={{fontSize:11,color:"#8891aa",textTransform:"uppercase",letterSpacing:".08em",marginBottom:10,paddingLeft:4}}>Upload Reports</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
              {/* Appointments PDF - drag and drop */}
              <div
                onDragOver={e=>{e.preventDefault();setApptDragOver(true);}}
                onDragLeave={()=>setApptDragOver(false)}
                onDrop={e=>{e.preventDefault();setApptDragOver(false);const f=e.dataTransfer.files[0];if(f&&f.type==='application/pdf')handleApptPDF(f);}}
                onClick={()=>document.getElementById('appt-file-input').click()}
                style={{background:apptDragOver?"#1e2f4a":apptDone?"#1a3a1a":"#161922",border:`2px dashed ${apptDragOver?"#4f8ef7":apptDone?"#34d399":"#2e3247"}`,borderRadius:16,padding:"24px 12px",textAlign:"center",cursor:"pointer",transition:"all 0.15s",userSelect:"none",transform:apptDragOver?"scale(1.02)":"scale(1)",boxShadow:apptDragOver?"0 0 20px rgba(79,142,247,0.3)":"none"}}
              >
                <input id="appt-file-input" type="file" accept=".pdf" style={{display:"none"}} onChange={e=>e.target.files[0]&&handleApptPDF(e.target.files[0])}/>
                <div style={{fontSize:32,marginBottom:8}}>{apptParsing?"⏳":apptDone?"✅":"📅"}</div>
                <div style={{fontSize:13,fontWeight:600,color:apptDone?"#34d399":"#c8cfe0",marginBottom:6}}>
                  {apptParsing?"Reading...":apptDone?"Appointments ✓":"Appointments PDF"}
                </div>
                <div style={{fontSize:11,color:"#8891aa",marginBottom:4}}>{apptDone?apptFile?.name:"Day Summary report"}</div>
                {!apptDone&&<div style={{fontSize:11,color:"#4f8ef7",marginTop:4}}>Drag & drop or tap to upload</div>}
              </div>
              {/* Collections PDF - drag and drop */}
              <div
                onDragOver={e=>{e.preventDefault();setCollDragOver(true);}}
                onDragLeave={()=>setCollDragOver(false)}
                onDrop={e=>{e.preventDefault();setCollDragOver(false);const f=e.dataTransfer.files[0];if(f&&f.type==='application/pdf')handleCollPDF(f);}}
                onClick={()=>document.getElementById('coll-file-input').click()}
                style={{background:collDragOver?"#1e2f4a":collDone?"#1a3a1a":"#161922",border:`2px dashed ${collDragOver?"#4f8ef7":collDone?"#34d399":"#2e3247"}`,borderRadius:16,padding:"24px 12px",textAlign:"center",cursor:"pointer",transition:"all 0.15s",userSelect:"none",transform:collDragOver?"scale(1.02)":"scale(1)",boxShadow:collDragOver?"0 0 20px rgba(79,142,247,0.3)":"none"}}
              >
                <input id="coll-file-input" type="file" accept=".pdf" style={{display:"none"}} onChange={e=>e.target.files[0]&&handleCollPDF(e.target.files[0])}/>
                <div style={{fontSize:32,marginBottom:8}}>{collParsing?"⏳":collDone?"✅":"💰"}</div>
                <div style={{fontSize:13,fontWeight:600,color:collDone?"#34d399":"#c8cfe0",marginBottom:6}}>
                  {collParsing?"Reading...":collDone?"Collections ✓":"Collections PDF"}
                </div>
                <div style={{fontSize:11,color:"#8891aa",marginBottom:4}}>{collDone?collFile?.name:"Cash Summary report"}</div>
                {!collDone&&<div style={{fontSize:11,color:"#4f8ef7",marginTop:4}}>Drag & drop or tap to upload</div>}
              </div>
              {/* Auto Pays CSV - optional monthly upload */}
              <div
                onDragOver={e=>{e.preventDefault();setAutoPayDragOver(true);}}
                onDragLeave={()=>setAutoPayDragOver(false)}
                onDrop={e=>{e.preventDefault();setAutoPayDragOver(false);const f=e.dataTransfer.files[0];if(f)handleAutoPayCSV(f);}}
                onClick={()=>document.getElementById('autopay-file-input').click()}
                style={{background:autoPayDragOver?"#1e2f4a":autoPayDone?"#1a3a1a":"#161922",border:`2px dashed ${autoPayDragOver?"#4f8ef7":autoPayDone?"#34d399":"#2e3247"}`,borderRadius:16,padding:"24px 12px",textAlign:"center",cursor:"pointer",transition:"all 0.15s",userSelect:"none",transform:autoPayDragOver?"scale(1.02)":"scale(1)",boxShadow:autoPayDragOver?"0 0 20px rgba(79,142,247,0.3)":"none",gridColumn:"1 / -1"}}
              >
                <input id="autopay-file-input" type="file" accept=".csv" style={{display:"none"}} onChange={e=>e.target.files[0]&&handleAutoPayCSV(e.target.files[0])}/>
                <div style={{fontSize:32,marginBottom:8}}>{autoPayParsing?"⏳":autoPayDone?"✅":"💳"}</div>
                <div style={{fontSize:13,fontWeight:600,color:autoPayDone?"#34d399":"#c8cfe0",marginBottom:6}}>
                  {autoPayParsing?"Reading...":autoPayDone?`Auto Pays ✓ — ${values.autoPayPatients} patients · $${Number(values.autoPayAmount).toLocaleString()}`:autoPayDone?"Auto Pays ✓":"Auto Pays Report/CP (Optional)"}
                </div>
                <div style={{fontSize:11,color:"#8891aa",marginBottom:4}}>{autoPayDone?`${autoPayFile?.name} · Month auto-detected`:"Cash Practice CSV — monthly upload"}</div>
                {!autoPayDone&&<div style={{fontSize:11,color:"#4f8ef7",marginTop:4}}>Drag & drop or tap · Optional — skip if not running this month</div>}
              </div>
            </div>

            {/* NP & EPROF Reports - full width row */}
            <div style={{fontSize:11,color:"#8891aa",textTransform:"uppercase",letterSpacing:".08em",marginBottom:10,paddingLeft:4}}>Patient Reports (Monthly)</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
              {/* NP Report */}
              <div
                onDragOver={e=>{e.preventDefault();setNpDragOver(true);}}
                onDragLeave={()=>setNpDragOver(false)}
                onDrop={e=>{e.preventDefault();setNpDragOver(false);const f=e.dataTransfer.files[0];if(f)handleNPPDF(f);}}
                onClick={()=>document.getElementById('np-file-input').click()}
                style={{background:npDragOver?"#1e2f4a":npDone?"#1a3a1a":"#161922",border:`2px dashed ${npDragOver?"#4f8ef7":npDone?"#34d399":"#2e3247"}`,borderRadius:16,padding:"24px 12px",textAlign:"center",cursor:"pointer",transition:"all 0.15s",userSelect:"none",transform:npDragOver?"scale(1.02)":"scale(1)",boxShadow:npDragOver?"0 0 20px rgba(79,142,247,0.3)":"none"}}
              >
                <input id="np-file-input" type="file" accept=".pdf" style={{display:"none"}} onChange={e=>e.target.files[0]&&handleNPPDF(e.target.files[0])}/>
                <div style={{fontSize:32,marginBottom:8}}>{npParsing?"⏳":npDone?"✅":"👥"}</div>
                <div style={{fontSize:13,fontWeight:600,color:npDone?"#34d399":"#c8cfe0",marginBottom:6}}>
                  {npParsing?"Reading...":npDone?`NP Report ✓ — ${npResults?.patients?.length} patients`:"New Patient Report"}
                </div>
                <div style={{fontSize:11,color:"#8891aa",marginBottom:4}}>{npDone?npFile?.name:"Monthly NP report PDF"}</div>
                {!npDone&&<div style={{fontSize:11,color:"#4f8ef7",marginTop:4}}>Drag & drop or tap · Adds patients to tracker</div>}
              </div>
              {/* EPROF Report */}
              <div
                onDragOver={e=>{e.preventDefault();setEprofDragOver(true);}}
                onDragLeave={()=>setEprofDragOver(false)}
                onDrop={e=>{e.preventDefault();setEprofDragOver(false);const f=e.dataTransfer.files[0];if(f)handleEPROFPDF(f);}}
                onClick={()=>document.getElementById('eprof-file-input').click()}
                style={{background:eprofDragOver?"#1e2f4a":eprofDone?"#1a3a1a":"#161922",border:`2px dashed ${eprofDragOver?"#4f8ef7":eprofDone?"#34d399":"#2e3247"}`,borderRadius:16,padding:"24px 12px",textAlign:"center",cursor:"pointer",transition:"all 0.15s",userSelect:"none",transform:eprofDragOver?"scale(1.02)":"scale(1)",boxShadow:eprofDragOver?"0 0 20px rgba(79,142,247,0.3)":"none"}}
              >
                <input id="eprof-file-input" type="file" accept=".pdf" style={{display:"none"}} onChange={e=>e.target.files[0]&&handleEPROFPDF(e.target.files[0])}/>
                <div style={{fontSize:32,marginBottom:8}}>{eprofParsing?"⏳":eprofDone?"✅":"✔️"}</div>
                <div style={{fontSize:13,fontWeight:600,color:eprofDone?"#34d399":"#c8cfe0",marginBottom:6}}>
                  {eprofParsing?"Reading...":eprofDone?`EPROF Report ✓ — ${eprofResults?.length} completions`:"EPROF Report"}
                </div>
                <div style={{fontSize:11,color:"#8891aa",marginBottom:4}}>{eprofDone?eprofFile?.name:"Active care completions PDF"}</div>
                {!eprofDone&&<div style={{fontSize:11,color:"#4f8ef7",marginTop:4}}>Drag & drop or tap · Marks active care complete</div>}
              </div>
            </div>

            {/* Visit Fields */}
            <div style={{fontSize:11,color:"#8891aa",textTransform:"uppercase",letterSpacing:".08em",marginBottom:10,paddingLeft:4}}>Visit Numbers</div>
            <div style={{background:"#161922",border:"1px solid #2e3247",borderRadius:16,overflow:"hidden",marginBottom:16}}>
              {VISIT_FIELDS.map((f,i,arr)=>(
                <div key={f.key} style={{display:"flex",alignItems:"center",padding:"13px 20px",borderBottom:i<arr.length-1?"1px solid #1e2130":"none",background:values[f.key]?"#161922":"transparent"}}>
                  <div style={{fontSize:20,width:36}}>{f.icon}</div>
                  <div style={{flex:1}}>
                    <div style={{fontSize:14,color:"#c8cfe0",fontWeight:500}}>{f.label}</div>
                    {f.key==="pv"&&(Number(values.adjustments)||0)+(Number(values.decompression)||0)+(Number(values.softwave)||0)>0&&(
                      <div style={{fontSize:11,color:"#8891aa",marginTop:2}}>Adj {values.adjustments||0} + Decomp {values.decompression||0} + SW {values.softwave||0}</div>
                    )}
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:4}}>
                    {f.dollar&&<span style={{color:"#8891aa",fontSize:16}}>$</span>}
                    <input type="number" min="0" step={f.dollar?"0.01":"1"} value={values[f.key]||""} onChange={e=>set(f.key,e.target.value)} placeholder="0"
                      style={{background:"#0f1117",border:`1px solid ${values[f.key]?"#4f8ef7":"#2e3247"}`,color:f.color,borderRadius:10,padding:"10px 14px",fontSize:17,fontWeight:700,fontFamily:"inherit",width:f.dollar?120:90,textAlign:"center",outline:"none"}}/>
                  </div>
                </div>
              ))}
            </div>

            {/* Collection Fields */}
            <div style={{fontSize:11,color:"#8891aa",textTransform:"uppercase",letterSpacing:".08em",marginBottom:10,paddingLeft:4}}>Collections</div>
            <div style={{background:"#161922",border:"1px solid #2e3247",borderRadius:16,overflow:"hidden",marginBottom:16}}>
              {COLLECTION_FIELDS.map((f,i,arr)=>(
                <div key={f.key} style={{display:"flex",alignItems:"center",padding:"13px 20px",borderBottom:i<arr.length-1?"1px solid #1e2130":"none"}}>
                  <div style={{fontSize:20,width:36}}>{f.icon}</div>
                  <div style={{flex:1}}><div style={{fontSize:14,color:"#c8cfe0",fontWeight:500}}>{f.label}</div></div>
                  <div style={{display:"flex",alignItems:"center",gap:4}}>
                    <span style={{color:"#8891aa",fontSize:16}}>$</span>
                    <input type="number" min="0" step="0.01" value={values[f.key]||""} onChange={e=>set(f.key,e.target.value)} placeholder="0"
                      style={{background:"#0f1117",border:`1px solid ${values[f.key]?"#4f8ef7":"#2e3247"}`,color:f.color,borderRadius:10,padding:"10px 14px",fontSize:17,fontWeight:700,fontFamily:"inherit",width:120,textAlign:"center",outline:"none"}}/>
                  </div>
                </div>
              ))}
            </div>

            {/* Collections total */}
            <div style={{background:"#161922",border:"1px solid #4f8ef7",borderRadius:16,padding:"16px 20px",marginBottom:24,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{color:"#8891aa",fontSize:14}}>Total Collections</span>
              <span style={{color:"#4f8ef7",fontSize:22,fontWeight:700}}>${collections.toLocaleString("en-US",{minimumFractionDigits:2})}</span>
            </div>

            {/* Submit */}
            <button onClick={handleSubmit} disabled={submitting}
              style={{width:"100%",background:submitting?"#2e3247":"linear-gradient(135deg,#4f8ef7,#a78bfa)",color:"white",border:"none",borderRadius:14,padding:"18px",fontSize:18,fontWeight:700,cursor:submitting?"not-allowed":"pointer",fontFamily:"inherit"}}>
              {submitting?"Saving...":"✓ Submit Daily Stats"}
            </button>
            <p style={{textAlign:"center",color:"#8891aa",fontSize:12,marginTop:12}}>Data saves directly to the practice dashboard</p>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
