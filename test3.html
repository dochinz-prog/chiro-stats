<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Test3</title></head>
<body style="background:#0f1117;color:white;padding:40px;font-family:sans-serif;">
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
  function App() {
    const [n, setN] = React.useState(0);
    return (
      <div>
        <h1 style={{color:"#4f8ef7"}}>React working! ✓</h1>
        <button onClick={() => setN(n+1)}>Clicked {n} times</button>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
