<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChiroStats 2026</title>
</head>
<body style="margin:0;padding:0;background:#0f1117;">
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef, useMemo } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyBDFXvDT8gbadUob5aH8d68ZcMShsWt_EE",
      authDomain: "chirostats-6c3a2.firebaseapp.com",
      projectId: "chirostats-6c3a2",
      storageBucket: "chirostats-6c3a2.firebasestorage.app",
      messagingSenderId: "602082979448",
      appId: "1:602082979448:web:2f524c8689d49b0803878d",
    };
    const fbApp = firebase.initializeApp(firebaseConfig);
    const db = fbApp.firestore();

    function App() {
      const [loaded, setLoaded] = useState(false);
      const [count, setCount] = useState(0);

      useEffect(() => {
        db.collection("chiro2026").doc("2026").get()
          .then(snap => { setLoaded(true); })
          .catch(() => { setLoaded(true); });
      }, []);

      if (!loaded) return (
        <div style={{color:"white", padding:40, fontFamily:"sans-serif"}}>
          <h2 style={{color:"#4f8ef7"}}>Connecting to Firebase...</h2>
        </div>
      );

      return (
        <div style={{color:"white", padding:40, fontFamily:"sans-serif"}}>
          <h1 style={{color:"#4f8ef7"}}>ChiroStats 2026 ✓</h1>
          <p>Firebase connected! Click to test React state:</p>
          <button onClick={() => setCount(c => c+1)} style={{padding:"10px 20px", fontSize:16}}>
            Clicked {count} times
          </button>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
